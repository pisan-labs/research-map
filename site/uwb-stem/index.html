<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UW Bothell School of STEM research map</title>
<style>:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --raised: #ffffff;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --grid: #e1e0d9;
  --line: #c3c2b7;
  --ring: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --hi: #0b0b0b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --other: #a3a19a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #242422;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9d9b94;
    --grid: #2c2c2a; --line: #383835; --ring: rgba(255, 255, 255, 0.10);
    --accent: #3987e5; --hi: #f0efec;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --other: #6f6d68;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --raised: #242422;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9d9b94;
  --grid: #2c2c2a; --line: #383835; --ring: rgba(255, 255, 255, 0.10);
  --accent: #3987e5; --hi: #f0efec;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --other: #6f6d68;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
}
h1 { font-size: 18px; margin: 0; font-weight: 650; }
h2 { font-size: 17px; margin: 0 0 2px; font-weight: 650; }
h3 { font-size: 12px; margin: 16px 0 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
p { margin: 0 0 8px; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.bar {
  display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: end; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--grid); background: var(--surface);
}
.brand p { margin: 0; font-size: 12px; }
.titlerow { display: flex; align-items: center; gap: 10px; }
button.small { min-height: 28px; padding: 2px 10px; font-size: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; flex: 1 1 520px; justify-content: flex-end; }
.field { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }
.field.grow { flex: 1 1 240px; max-width: 420px; }
input, select, button {
  font: inherit; color: var(--ink); background: var(--raised);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 34px;
}
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, canvas:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
button { cursor: pointer; }
button.ghost { background: transparent; }

.layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
.mapwrap { position: relative; min-height: 420px; background: var(--surface); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map.pointing { cursor: pointer; }
.panel {
  border-left: 1px solid var(--grid); background: var(--surface);
  padding: 14px 16px 24px; overflow-y: auto; min-height: 0;
}
.foot { padding: 8px 16px; font-size: 12px; border-top: 1px solid var(--grid); background: var(--surface); }

.tip {
  position: absolute; pointer-events: none; z-index: 5; max-width: 280px;
  background: var(--raised); color: var(--ink); border: 1px solid var(--ring);
  border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .14);
}
.tip b { display: block; font-size: 13px; }
.tip .k { color: var(--ink-2); }

.zoombtns { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoombtns button { width: 34px; height: 34px; padding: 0; font-size: 17px; line-height: 1; background: var(--raised); }

.legend {
  position: absolute; left: 12px; top: 12px; width: 250px; max-width: calc(100% - 24px);
  background: var(--raised); border: 1px solid var(--ring); border-radius: 8px;
  padding: 6px 10px; font-size: 12px; max-height: calc(100% - 24px); overflow-y: auto;
}
.legend summary { cursor: pointer; font-weight: 600; color: var(--ink-2); padding: 2px 0; }
.legend:not([open]) { width: auto; }
.legend button {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  border: 0; background: none; padding: 3px 4px; min-height: 26px; border-radius: 4px; color: var(--ink);
}
.legend button:hover, .legend button[aria-pressed="true"] { background: var(--grid); }
.legend svg { flex: none; }
.legend .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend .note { color: var(--muted); margin-top: 4px; }

.card .sub { color: var(--ink-2); margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none; }
.chips li { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--ink-2); }
.near { list-style: none; margin: 0; padding: 0; }
.near li { border-top: 1px solid var(--grid); }
.near button {
  width: 100%; text-align: left; border: 0; background: none; padding: 7px 2px; border-radius: 0;
  display: grid; grid-template-columns: 1fr auto; gap: 0 8px;
}
.near button:hover { background: var(--grid); }
.near .who { font-weight: 550; }
.near .why { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.near .score { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pubs { list-style: none; margin: 0; padding: 0; }
.pubs li { border-top: 1px solid var(--grid); padding: 6px 0; font-size: 13px; }
.pubs .why { display: block; font-size: 12px; color: var(--muted); }
h3 .count { text-transform: none; letter-spacing: 0; font-weight: 400; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.bio { color: var(--ink-2); font-size: 13px; }
.hits { list-style: none; margin: 0; padding: 0; }
.hits li { border-top: 1px solid var(--grid); }
.hits button { width: 100%; text-align: left; border: 0; background: none; padding: 8px 2px; border-radius: 0; }
.hits button:hover { background: var(--grid); }
.hits .why { display: block; font-size: 12px; color: var(--muted); }
.hits .ev { display: block; font-size: 12px; color: var(--ink-2); margin-top: 3px; line-height: 1.35; }
.hits .evk { color: var(--muted); font-variant-numeric: tabular-nums; }
.project { display: flex; flex-direction: column; gap: 6px; }
.project textarea { font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; min-height: 84px; }
.project button { align-self: flex-start; }
mark { background: color-mix(in srgb, var(--s4) 35%, transparent); color: inherit; border-radius: 2px; }
.back { margin-bottom: 10px; }

@media (max-width: 820px) {
  body { display: block; height: auto; }
  .bar { padding: 10px 16px; gap: 8px; }
  h1 { font-size: 16px; }
  #subtitle { display: none; }
  .titlerow { justify-content: space-between; }
  .layout { display: block; }
  .mapwrap { height: 70vh; min-height: 360px; }
  .panel { border-left: 0; border-top: 1px solid var(--grid); overflow: visible; }
  .controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; flex: none; }
  .field.grow { grid-column: 1 / -1; max-width: none; }
  select { width: 100%; min-width: 0; }
  .legend { width: auto; max-width: 70%; max-height: 50%; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <div class="titlerow">
      <h1 id="title"></h1>
      <button id="theme" class="ghost small" type="button">Dark</button>
    </div>
    <p id="subtitle" class="muted"></p>
  </div>
  <div class="controls" role="search">
    <label class="field grow">
      <span class="sr">Search people and topics</span>
      <input id="q" type="search" placeholder="Search a name or topic, e.g. machine learning" autocomplete="off">
    </label>
    <label class="field">
      <span>Department</span>
      <select id="dept"><option value="">All</option></select>
    </label>
    <label class="field">
      <span>Rank</span>
      <select id="rank"><option value="">All</option></select>
    </label>
    <label class="field">
      <span>Colour by</span>
      <select id="colorby">
        <option value="department">Department</option>
        <option value="program">Program</option>
        <option value="area">Research area (computed)</option>
      </select>
    </label>
  </div>
</header>
<main class="layout">
  <section class="mapwrap" aria-label="Research map">
    <canvas id="map"></canvas>
    <div id="tip" class="tip" role="tooltip" hidden></div>
    <div class="zoombtns">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zreset" aria-label="Reset view">⟲</button>
    </div>
    <details id="legendbox" class="legend" open>
      <summary>Legend</summary>
      <div id="legend"></div>
    </details>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>
<footer class="foot muted" id="foot"></footer>

including serving as executive dean of workforce and STEM at Shoreline Community College. At UW Bothell, Hamilton leads efforts to build career-connected pathways into biotechnology by strengthening partnerships between students, faculty and the regional life sciences industry. His work focuses on expanding career awareness, developing industry-relevant and contextualized learning experiences and creating experiential opportunities that prepare students for careers in biotechnology and the life sciences.","listed":[],"url":"https://www.uwb.edu/faculty/guy-hamilton/","links":[],"orcid":"","openalex":[],"n_works":0,"pubs":[],"oa_topics":[],"x":0.6192,"y":0.3066,"area":0,"topic":11,"terms":["biotechnology","workforce","life","center","career","biology","serving","strengthening"],"sparse":false,"near":[{"i":59,"s":0.327,"t":[]},{"i":68,"s":0.306,"t":[]},{"i":5,"s":0.271,"t":[]}],"coauthors":[]},{"id":"kristina-hillesland","name":"Kristina Hillesland","title":"Associate Professor & Department Chair","department":"Biological Sciences","program":"Biological Sciences","keywords":"evolutionary biology and microbiology","interests":"Imagine that you could collect living samples of species like wolves or flowering plants from the ancient past and then transport them to the current time and compare them directly by watching them run or grow side-by-side. My research program does this sort of comparison using microorganisms, which we have propagated in the lab for 5000 generations. We kept intermediates in the freezer and can revive them and study them together in the same experiment. The goal of this research is to understand how evolution is affected by interactions between species, like predator-prey, competition, and mutualism. What kinds of characteristics do species get from evolving with other species? How does this affect the diversity of species? How does it affect the process of evolution? We do this work by measuring the growth of evolved species and other traits, by posable elements (TEs) and retrocopy-derived genes, and how these elements influence cellular processes, immune signaling, and evolutionary change. Although originally dismissed as “junk,” repetitive sequences shape genome structure, gene regulation, mutation rates, and host–pathogen interactions. They also provide accessible avenues for undergraduate research: the questions are compelling (sometimes bordering on sci-fi), datasets are abundant and public, and analyses can range from conceptual reasoning to fully computational workflows or low-cost wet-lab experiments. My goal is to build a research program that is simultaneously rigorous, creative, and highly participatory. I envision a lab where undergraduates are the primary drivers of discovery: an environment where students gain experience in the innate immune system, host-pathogen interactions, modern genomics, computational biology, molecular evolution, and hands-on experimental design while contributing to publishable research.","bio":"Dr. Rick McLaughlin studies genome evolution and the interactions between mobile genetic elements and the immune system. His research focuses on transposable elements (DNA sequences that copy themselves within genomes) and the evolutionary conflicts that have shaped them and our cellular defenses. He previously led a research group at the Pacific Northwest Research Institute, trained as a postdoctoral fellow at Fred Hutchinson Cancer Center and received his doctorate from UT Southwestern Medical Center. McLaughlin works to create opportunities for undergraduates to participate directly in scientific discovery. His teaching emphasizes active learning, scientific communication and helping students develop the confidence and skills to think and work as scientists, regardless of their prior experience.","listed":["Ecology, Evolution and Behavior","Genomic and Bioinformatics","Microbiology, Molecular and Cellular Biology"],"url":"https://www.uwb.edu/faculty/rick-mclaughlin/","links" oideum, otherwise known as a social amoeba. Dictyostelium is one of a handful of NIH model organisms for biomedical research. It has been used as a model system for cell-cell communication, phagocytosis, neurodegenerative disease, and multicellular development. She has used this organism to study cell-cell genetic conflicts. Her current research interests are focused on human genetic variation and the potential for genetic conflicts during pregnancy. During pregnancy, cells are exchanged between the mother and foetus, which can persist for decades following pregnancy. However, the impact of these foreign cells (termed ‘microchimerism’) on the health of the mother and baby are not yet understood.","bio":"Dr. Elizabeth Ostrowski’s research background is in microbiology, evolutionary genetics and genomics. Her research combines studies of natural populations with laboratory evolution experiments that identify genetic changes in real-time. She has a longstanding interest in genetic conflict, i.e., when the evolutionary interests of different genetic elements are not aligned. Such conflict can occur among different genomes within a cell, among different cells in a body or among different species. It potentially influences diverse processes, from the origins of complex life to health and disease.","listed":["Ecology, Evolution and Behavior","Genomic and Bioinformatics","Microbiology, Molecular and Cellular Biology"],"url":"https://www.uwb.edu/faculty/elizabeth-ostrowski/","links":[{"text":"Lab website","href":"https://www.ostrowski-lab.org/"}],"orcid":"","openalex":["A5070912354"],"n_works":15,"pubs":[["A comprehensive assessment of tandem repeat genotyping methods for Nanopore long-read genomes",2026,"Genome biology","https://doi.org/10.1186/s13059-026-04210-y"],["Hypermutable hotspot enables the rapid evolution of self/non-self recognition genes in Dictyostelium",2025,"Proceedings of the National Academy of Sciences","https://doi.org/10.1073/pnas.2520843122"],["Evolutio hington Bothell in 2001, and initiated an agent-based grid-computing research with NSF's support in 2005-07. He is currently working on multi-agent spatial simulation and agent-based data analysis. His research interests include mobile agents, multi-threading, cluster computing, grid computing, and distributed simulations.","listed":["Parallel, Distributed, Cloud, and Edge Computing"],"url":"https://www.uwb.edu/faculty/munehiro-fukuda/","links":[{"text":"Faculty website","href":"http://faculty.washington.edu/mfukuda/"}],"orcid":"","openalex":["A5090114871"],"n_works":39,"pubs":[["Agent-based Parallel Processing of Graph Database Queries",2026,"Research Square","https://doi.org/10.21203/rs.3.rs-10639273/v1"],["An Analysis of Three C/C++ Cluster-Computing Libraries for Agent-Based Models",2025,"ACM Transactions on Modeling and Computer Simulation","https://doi.org/10.1145/3732778"],["Agent-Based Computational Geometry",2025,"International Conference on Agents and Artificial Intelligence (ICAART)","https://doi.org/10.5220/0013240800003890"],["Toward Implementing an Agent-based Distributed Graph Database System",2024,"IEEE International Conference on Big Data (BigData)","https://doi.org/10.1109/bigdata62323.2024.10825052"],["Agent-Based versus Data-Streamed Big-Data Parallelization in Computational Geometry",2023,"Research Square","https://doi.org/10.21203/rs.3.rs-3414742/v1"],["Agent-Based Parallelization of a Multi-Dimensional Semantic Database Model",2023,"IEEE International Conference on Information Reuse and Integration (IRI)","https://doi.org/10.1109/iri58017.2023.00019"],["Automated Agent Migration over Distributed Data Structures",2023,"International Conference on Agents and Artificial Intelligence (ICAART)","https://doi.org/10.5220/0011784500003393"],["Pipelining Graph Construction and Agent-based Computation over Distributed Memory",2022,"IEEE International Conference on Big Data (BigData)","https://doi.org/10.1109/bigdata55660.2022.10020903"],["An Interactive  Israel Institute of Technology in 1990. His MSc in applied mathematics and management and BSc in civil engineering are also from the Technion. During his postdoc in Manchester, UK, he developed a LISP-based knowledge-based system for cost-time forecasting. He subsequently taught computer applications as a senior lecturer and professor at the University of Strathclyde and Glasgow Caledonian University in Scotland. There, he established and led the Virtual 4D Intelligent Simulation group, focusing on time-based simulation of construction site design and management. In 2000, Retik joined Microsoft as a technical program manager in CoreOS, subsequently working in the developer, business development, and tech evangelism divisions, rising to the director level. Prior to joining UW Bothell as a full-time member in 2016, he co-founded one startup and served as CTO of another. He is a member of ACM and Computing For All, and has previously served as a member of PMI and IEEE.","listed":["Computer Science Education","Software Engineering"],"url":"https://www.uwb.edu/faculty/arkady-retik/","links":[],"orcid":"","openalex":["A5033744147"],"n_works":8,"pubs":[["Scaling Software Experiments to the Thousands",2014,"International Conference on Computer Supported Education","https://doi.org/10.5220/0004965505940601"],["The Organization and Management of Construction",2012,"Routledge eBooks","https://doi.org/10.4324/9780203477106"],["Knowledge Engineering and Construction",2012,"","https://doi.org/10.4324/9780203477106-8"],["Design Construction and It",2012,"","https://doi.org/10.4324/9780203477106-10"],["The Firm and Its Competitive Partners",2012,"","https://doi.org/10.4324/9780203477083-11"],["The Internet and Construction",2012,"","https://doi.org/10.4324/9780203477106-7"],["The Firm and Strategic Change",2012,"","https://doi.org/10.4324/9780203477083-7"],["Visual search with deep zoom to explore curriculum resources interactively",2012,"ACM Conference on Innovation and Technolog "title":"Assistant Teaching Professor","department":"Engineering & Mathematics","program":"Mathematics","keywords":"","interests":"","bio":"Andrew Abian received his M.S. in physics from the University of Washington, and B.S. in mathematics with a minor in physics from the University of Iowa. He has also studied French at the Sorbonne in Paris, and statistics at Columbia University in New York. Prior to teaching at UW Bothell, he taught both math and physics courses at various community colleges in the Seattle area, as well as in Austin, Texas. He has also worked as an actuarial analyst, software developer and bicycle mechanic. Andrew currently teaches undergraduate mathematics courses ranging from Pre-Algebra to Differential Equations and Matrix Algebra. He has also led six editions of a month-long UW Study Abroad program to Europe.","listed":["Applied and Computational Mathematics"],"url":"https://www.uwb.edu/faculty/andrew-abian/","links":[],"orcid":"","openalex":[],"n_works":0,"pubs":[],"oa_topics":[],"x":0.9253,"y":0.428,"area":0,"topic":0,"terms":["physics","mathematics","actuarial analyst","york","studied french","ranging","sorbonne","abroad"],"sparse":false,"near":[{"i":54,"s":0.6,"t":[]},{"i":61,"s":0.505,"t":["mathematics"]},{"i":52,"s":0.433,"t":[]},{"i":62,"s":0.373,"t":[]},{"i":64,"s":0.354,"t":["mathematics"]},{"i":53,"s":0.34,"t":[]},{"i":63,"s":0.327,"t":[]},{"i":55,"s":0.319,"t":[]},{"i":50,"s":0.283,"t":[]},{"i":83,"s":0.282,"t":["physics"]}],"coauthors":[]},{"id":"rejoice-akapame","name":"Rejoice Akapame","title":"Associate Professor","department":"Engineering & Mathematics","program":"Mathematics","keywords":"mathematics education; equity; mathematical modeling; technology use in K-16; computational thinking","interests":"","bio":"","listed":["Mathematics Education"],"url":"https://www.uwb.edu/faculty/rejoice-akapame/","links":[],"orcid":"","openalex":["A5041472334"],"n_works":2,"pubs":[["Connecting the “Real-World” to the Math Classroom: Impleme Mathematics","keywords":"actuarial science education","interests":"Actuarial Science Education, Combinatorics, Algebraic Geometry","bio":"Dr. Ariana Dundon is a Pacific Northwest native who earned her Ph.D. in mathematics from the University of Washington. Prior to joining UW Bothell, she taught at Montgomery College in Rockville, MD. She teaches a wide variety of math classes including calculus, probability and statistics, geometry, and financial mathematics. She helped create the Actuarial Science program at UW Bothell and continues to mentor students interested in this field.","listed":["Actuarial Science","Pure and Theoretical Mathematics"],"url":"https://www.uwb.edu/faculty/ariana-dundon/","links":[],"orcid":"","openalex":[],"n_works":0,"pubs":[],"oa_topics":[],"x":0.9443,"y":0.4515,"area":0,"topic":0,"terms":["actuarial","combinatorics","algebraic geometry","education"],"sparse":false,"near":[{"i":54,"s":0.434,"t":[]},{"i":49,"s":0.433,"t":[]},{"i":53,"s":0.398,"t":[]},{"i":61,"s":0.367,"t":[]},{"i":85,"s":0.361,"t":["education"]},{"i":64,"s":0.352,"t":[]},{"i":50,"s":0.293,"t":[]},{"i":83,"s":0.281,"t":[]},{"i":63,"s":0.27,"t":[]}],"coauthors":[]},{"id":"elizabeth-field","name":"Elizabeth Field","title":"Assistant Professor","department":"Engineering & Mathematics","program":"Mathematics","keywords":"geometric group theory, geometric topology, and low-dimensional topology","interests":"Dr. Field’s current research projects lie primarily in the intersection of the fields of geometry, topology and algebra. While geometry is concerned with rigid properties of spaces, such as distance and measurements, topology focuses on properties of spaces that remain unchanged when the space is deformed via actions such as twisting, stretching, or shrinking. In one ongoing research project, Field studies topological spaces which include 2-dimensional surfaces (think of the glaze on a donut – this is an example of a surface with one “hole”, known as a torus) and 3-dimensional manifolds. It turns out that certain 3-manifolds can be built from surfaces utilizing a symmetry of the surface and then given a geometry which depends on the symmetry used in the construction. With this geometry, one can then ask questions about the volume of the resultant 3-manifold. Field studies the relationship between the volume of the 3-manifold and the symmetry of the surface used in the construction and uses tools from algebra to formalize these relationships.","bio":"Dr. Elizabeth Field received her B.A. in Mathematics from Southern Connecticut State University, where she also graduated with a B.S. in Elementary and Special Education. She completed her doctoral degree in Mathematics at the University of Illinois at Urbana-Champaign. She went on to work at the University of Utah where she was a NSF Postdoctoral Scholar. Her research interests are in geometric group theory, geometric topology, and low-dimensional topology.","listed":["Pure and Theoretical Mathematics"],"url":"https://www.uwb.edu/faculty/elizabeth-field/","links":[{"text":"Personal website","href":"https://sites.google.com/view/elizabeth-field"}],"orcid":"","openalex":[],"n_works":0,"pubs":[],"oa_topics":[],"x":0.9173,"y":0.522,"area":0,"topic":7,"terms":["surface","spaces","symmetry","topology","geometry","manifolds","volume","dimensional"],"sparse":false,"near":[{"i":60,"s":0.634,"t":[]},{"i":58,"s":0.578,"t":[]},{"i":63,"s":0.552,"t":["geometry"]},{"i":54,"s":0.404,"t":[]},{"i":52,"s":0.398,"t":[]},{"i":61,"s":0.39,"t":[]},{"i":49,"s":0.34,"t":[]},{"i":62,"s":0.271,"t":[]}],"coauthors":[]},{"id":"emily-gismervig","name":"Emily Gismervig","title":"Teaching Professor","department":"Engineering & Mathematics","program":"Mathematics","keywords":"mathematics education","interests":"Dr. Gismervig worked with colleagues to develop the Directed Self-Placement instrument and continues to work on refining and assessing the placement process. She worked with colleagues to develop our stretch calculus sequence, where Calculus I is taught over two quarters with just-in-time review incorporated throughout the course. Gismervig also work to develop free course materials for the introductory course materials. She has authored and co-authored workbooks for Precalculus II, Calculus I and Stretch Calculus.","bio":"Dr. Emily Gismervig's work is primarily focused on the experience of UW Bothell's first year students. She teaches extensively in the precalculus and calculus sequences, creates free course materials, works on the directed self placement process and mentors colleagues who are teaching precalculus and calculus.","listed":["Applied and Computational Mathematics","Mathematics Education"],"url":"https://www.uwb.edu/faculty/emily-gismervig/","links":[],"orcid":"","openalex":[],"n_works":0,"pubs":[],"oa_topics":[],"x":0.9814,"y":0.4712,"area":0,"topic":0,"terms":["calculus","stretch","colleagues","worked","materials","sequence","self-placement instrument","quarters"],"sparse":false,"near":[{"i":61,"s":0.673,"t":[]},{"i":49,"s":0.6,"t":[]},{"i":64,"s":0.512,"t":[]},{"i":50,"s":0.466,"t":[]},{"i":52,"s":0.434,"t":[]},{"i":55,"s":0.433,"t":["calculus"]},{"i":53,"s":0.404,"t":[]},{"i":62,"s":0.389,"t":[]},{"i":63,"s":0.387,"t":[]},{"i":60,"s":0.377,"t":[]}],"coauthors":[]},{"id":"nicole-hoover","name":"Nicole Hoover","title":"Associate Teaching Professor","department":"Engineering & Mathematics","program":"Mathematics","keywords":"","interests":"Professor Hoover spent their sabbatical creating free online homework materials for the Calculus I and II courses and has created or co-created workbooks for every class they have taught at UW Bothell.","bio":"Nicole Hoover received their B.A. in Mathematics from San Jose State University and later earned their M.A. in Mathematics from the University of California Davis. They served in several instructional capacities at UC Davis, Cosumnes River College, and the University of New Orleans before joining UW Bothell in 2006. They  first-generation college graduate born in South America, she has a distinguished career in teaching and mentoring, particularly in optimization. After starting her career at the Universidad Central de Venezuela and Florida Memorial University, she joined UW Bothell in 2014 and was promoted to associate professor in 2020. She has received multiple honors for her teaching and mentorship, including the 2018 Chancellor’s Distinguished Undergraduate Research and Creative Practice Mentor Award and recognition at the 2019 Latinx Faculty Recognition Event. She is currently an active member of the NSF ADVANCE Partnership ASCEND project, focusing on supporting mid-career women in STEM and fostering diverse, inclusive institutional environments.","listed":["Applied and Computational Mathematics"],"url":"https://www.uwb.edu/faculty/milagros-loreto/","links":[{"text":"Personal website","href":"https://faculty.washington.edu/mloreto/"}],"orcid":"","openalex":["A5036050052"],"n_works":4,"pubs":[["A new spectral conjugate subgradient method with application in computed tomography image reconstruction",2024,"Optimization methods & software","https://doi.org/10.1080/10556788.2024.2372668"],["A numerical study of applying spectral-step subgradient method for solving nonsmooth unconstrained optimization problems",2018,"Computers & Operations Research","https://doi.org/10.1016/j.cor.2018.12.006"],["Nonsmooth spectral gradient methods for unconstrained optimization",2017,"EURO Journal on Computational Optimization","https://doi.org/10.1007/s13675-017-0080-8"],["Convergence analysis for the modified spectral projected subgradient method",2014,"Optimization Letters","https://doi.org/10.1007/s11590-014-0792-0"]],"oa_topics":["Optimization and Variational Analysis","Advanced Optimization Algorithms Research"],"x":0.787,"y":0.5788,"area":0,"topic":7,"terms":["variational","optimization","numerical","algorithms","mathematics","spans linear","nonsmooth","nonlinear programming"],"sparse":false, thways and opportunities for student success. This work was fueled by her own lived experience as a first-generation Native woman from an economically disadvantaged background. Notable achievements in supporting student success include her work in establishing the first NSF-funded REU site at UW Bothell, collaborating with campus leadership to pilot a centralized peer facilitator program, supporting sustainable success of experiential learning activities through infrastructure building and policy making, and leading efforts to put people first by building community that supports wellbeing.","listed":["Pure and Theoretical Mathematics"],"url":"https://www.uwb.edu/faculty/jennifer-mcloud-mann/","links":[],"orcid":"","openalex":["A5004133819"],"n_works":8,"pubs":[["Puzzling Pentagons—How Many Ways Can We Cover a Flat Surface?",2023,"Frontiers for Young Minds","https://doi.org/10.3389/frym.2023.953114"],["Nonexpansive directions in the Jeandel-Rao Wang shift",2023,"Discrete and Continuous Dynamical Systems","https://doi.org/10.3934/dcds.2023046"],["Hexagonal mosaic links generated by saturation",2020,"Journal of Knot Theory and Its Ramifications","https://doi.org/10.1142/s0218216520500856"],["Convex pentagons that admit i-block transitive tilings",2017,"Geometriae Dedicata","https://doi.org/10.1007/s10711-017-0270-9"],["Stick numbers in the simple hexagonal lattice",2015,"Involve a Journal of Mathematics","https://doi.org/10.2140/involve.2015.8.503"],["Extending patches to fullerenes",2014,"Ars Mathematica Contemporanea","https://doi.org/10.26493/1855-3974.486.28c"],["THE STICK NUMBER FOR THE SIMPLE HEXAGONAL LATTICE",2012,"Journal of Knot Theory and Its Ramifications","https://doi.org/10.1142/s0218216512501209"],["Side lengths of pseudoconvex fullerene patches",2012,"Ars Mathematica Contemporanea","https://doi.org/10.26493/1855-3974.231.d5b"]],"oa_topics":["Geometric and Algebraic Topology","Mathematics and Applications","Advanced Combinatorial Mathematics","Mathematical Dynamics and Fractals"],"x":0.8805,"y":0.5717,"area":0,"topic":7,"terms":["algebraic topology","combinatorial mathematics","geometric","knot","tiling","advanced","discrete","fractals"],"sparse":false,"near":[{"i":58,"s":0.821,"t":["algebraic topology","dynamics","fractals"]},{"i":53,"s":0.634,"t":[]},{"i":63,"s":0.616,"t":["fractals"]},{"i":54,"s":0.377,"t":[]},{"i":62,"s":0.377,"t":[]},{"i":57,"s":0.267,"t":[]}],"coauthors":[[58,4]]},{"id":"alexandria-musselman","name":"Alexandria Musselman","title":"Associate Teaching Professor","department":"Engineering & Mathematics","program":"Mathematics","keywords":"mathematics education; student identity; gender studies","interests":"Her personal research interests include understanding the purposes of school mathematics, exploring the promotion of equitable access to meaningful mathematics for all groups, and gaining insight into students’ mathematical identities and experiences at the secondary and undergraduate levels.","bio":"Dr. Alexandria Theakston Musselman earned a Ph.D. in mathematics education at Michigan State University (MSU). She holds a M.S. in mathematics and a Certification in College Teaching, also from MSU. Prior to coming to UW Bothell, she taught at Western Washington University and Bard College at Simon’s Rock in Massachusetts. She has experience teaching a variety of undergraduate mathematics courses for pre-majors and math majors, as well as courses for practicing and pre-service teachers. As a first-generation college student who began at a community college, Dr. Theakston Musselman is passionate about finding ways to support students who are traditionally underserved and underrepresented within collegiate mathematics. Because mathematics, in particular, has served as a gatekeeper to advanced educational and work opportunities for many students of color and young women, her motivation as a teacher and mathematics education researcher is to provide access to meaningful experiences in mathematics for  examines the nature and quality of mathematical discourse in hybrid and online learning environments. This work is informed by her extensive experience developing internet-based courses in mathematics and statistics education, specifically designed to meet the needs of place-bound, practicing mathematics and science teachers. Her research has been published in several peer-reviewed journals, including the Journal of Distance Education (Revue de l’éducation à distance), the Journal of Computers in Mathematics and Science Teaching, Mathematics and Computer Education, Teaching Children Mathematics, and FOCUS on Learning Problems in Mathematics. She has also secured external funding to support her scholarly work from a range of agencies and foundations, including the National Science Foundation, the Environmental Protection Agency, the Steele-Reese Foundation, the Charlotte Martin Foundation, the Alfred P. Sloan Foundation, the Arizona Board of Regents, and the Montana Office of Public Instruction.","bio":"Dr. Linda Simonsen joined University of Washington Bothell in 2010 from the Department of Mathematics at the University of Arizona. During her early years at UW Bothell, she developed the mathematics program, building it from the ground up and shaping its curriculum and direction. She also played a key role on the committee that established the School of STEM. Simonsen earned her Ph.D. in Mathematics Education from Oregon State University in 1995. She subsequently spent more than a decade in the Department of Mathematical Sciences at Montana State University in Bozeman, Montana.","listed":["Mathematics Education"],"url":"https://www.uwb.edu/faculty/linda-simonsen/","links":[],"orcid":"","openalex":["A5085823833"],"n_works":2,"pubs":[["The Impact of Participation in STEM Outreach on Persistence of Diverse Students in Physics, Math, and Engineering",2024,"Journal of STEM Education Innovations and Research","https://doi.org/10.63504/jstem.v25i2.2592"],["Elementary Teachers' Mathematical Knowledge for Teaching Prerequisite Algebra Concepts.",2011,"IUMPST The Journal","https://openalex.org/W141625467"]],"oa_topics":["Career Development and Diversity","Mathematics Education and Teaching Techniques"],"x":0.9253,"y":0.2788,"area":0,"topic":0,"terms":["foundation","mathematics","support","scholarly","journal","distance","teach","secured external"],"sparse":false,"near":[{"i":61,"s":0.596,"t":["mathematics"]},{"i":50,"s":0.535,"t":[]},{"i":12,"s":0.515,"t":[]},{"i":54,"s":0.512,"t":[]},{"i":55,"s":0.486,"t":[]},{"i":59,"s":0.48,"t":[]},{"i":85,"s":0.375,"t":[]},{"i":49,"s":0.354,"t":["mathematics"]},{"i":52,"s":0.352,"t":[]},{"i":83,"s":0.351,"t":[]}],"coauthors":[[86,1]]},{"id":"shima-abadi","name":"Shima Abadi","title":"Professor","department":"Engineering & Mathematics","program":"Mechanical Engineering","keywords":"array signal processing; underwater acoustics; machine learning","interests":"Underwater Acoustics, Array Signal Processing, Ocean Engineering, Animal Bioacoustics, Acoustical Imaging","bio":"","listed":["Fluid Mechanics","Ocean Sciences & Marine Engineering"],"url":"https://www.uwb.edu/faculty/shima-abadi/","links":[{"text":"Personal website","href":"https://sites.uw.edu/abadi/"}],"orcid":"","openalex":["A5047337456"],"n_works":110,"pubs":[["Detecting whale vocalizations up to 2.5 kHz using a seafloor distributed acoustic sensing array with incorporated loops",2026,"The Journal of the Acoustical Society of America","https://doi.org/10.1121/10.0047190"],["Vertical array distributed acoustic sensing using looped and spiral geometries for waterborne acoustic signals up to 3 kHz",2026,"The Journal of the Acoustical Society of America","https://doi.org/10.1121/10.0046913"],["Distributed Acoustic Sensing Beyond Optical Repeaters Offshore Oregon",2026,"The Seismic Record","https://doi.org/10.1785/0320260023"],["Estimating ship source levels using distributed acoustic sensing data and validation with hydrophone measurements",2026 ulsion plants, became an expert in deployable port and facility security programs, and established his credentials as a teacher, instructor and master training specialist. From the U.S. Navy, he transitioned to technology program leadership and management working with a broad variety of telecom and software companies, including AT&T Wireless and Cingular Wireless, and for the ten years prior to the University of Washington was an instructor and director of Pacific Maritime Institute here in Seattle, WA (part of MITAGS of Linthicum, MD). Throughout this time CAPT Anderson continued with various roles in technology leadership and management and has broad connections within the Maritime Engineering realm.","listed":["Design and Manufacturing","Ocean Sciences & Marine Engineering"],"url":"https://www.uwb.edu/faculty/bill-anderson","links":[],"orcid":"","openalex":[],"n_works":0,"pubs":[],"oa_topics":[],"x":0.6295,"y":0.455,"area":0,"topic":10,"terms":["capt","ships","training specialist","propulsion plants","realm","port","operated","maritime engineering"],"sparse":false,"near":[],"coauthors":[]},{"id":"miguel-balzan","name":"Miguel Balzan","title":"Assistant Teaching Professor","department":"Engineering & Mathematics","program":"Mechanical Engineering","keywords":"complex fluid behaviors, including effervescent atomization and drop impacts","interests":"","bio":"Dr. Miguel Balzan is a mechanical engineer and academic specializing in thermal–fluid sciences, with a sustained record of research innovation and undergraduate engineering education across multiple international institutions. His scholarly work encompasses experimental and computational investigations in multiphase flows, droplet impact dynamics, rheology, and related transport phenomena, leading to peer‑reviewed publications, conference presentations, industry‑sponsored reports, and a granted U.S. patent. Complementing this research portfolio, he has developed and delivered rigorous, project‑based curricula i <script>// Record-level search, shared by the page and tests/search_eval.mjs.
//
// Each person contributes records: every publication title, their directory
// keywords, profile interests, bio, and OpenAlex topics. A query is scored
// against every record with BM25, scaled by how much of the query the record
// covers. A person's score is their best 8 records with weights
// 1, 0.7, 0.49, ... (GTU's rule), so one strong paper counts and a long
// publication list alone does not win. Results carry the matching records

    "how what when which who why can").split(" "));

  const KIND_WEIGHT = { title: 1.0, keywords: 1.3, interests: 1.2, topic: 0.8, bio: 0.5, listed: 1.0 };
  const DECAY = 0.7;
  const BEST = 8;
  const K1 = 1.2, B = 0.75;

  function norm(s) {
    return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  // Light stemming: plurals and common suffixes, enough for "networks" ~ "network".
  function stem(w) {
    if (w.length <= 3) return w;
    if (w.endsWith("ies") && w.length > 4) return w.slice(0, -3) + "y";
    if (w.endsWith("sses")) return w.slice(0, -2);
    if (w.endsWith("es") && /(ch|sh|x|z)es$/.test(w)) return w.slice(0, -2);
    if (w.endsWith("s") && !/(ss|us|is|ics)$/.test(w)) w = w.slice(0, -1);
    if (w.endsWith("ing") && w.length > 6) return w.slice(0, -3);
    if (w.endsWith("ed") && w.length > 5) return w.slice(0, -2);
    return w;
  }

  function tokens(text) {
    const out = [];
    for (const raw of norm(text).split(/[^a-z0-9+#]+/)) {
      if (!raw || STOP.has(raw)) continue;
      if (raw.length < 2 && !/\d/.test(raw)) continue;
      out.push(stem(raw));
    }
    return out;
  }

  // people: page rows. opts.useListed: include department-curated area names
  // as records (the page does; the evaluation must not, they are its answers).
  function buildIndex(people, opts = {}) {
    const recs = [];
    const add = (p, kind, text, extra) => {
      const toks = tokens(text);
      if (toks.length) recs.push({ p, kind, text, toks, ...extra });
    };
    people.forEach((person, p) => {
      for (const w of person.pubs || []) add(p, "title", w[0], { y: w[1], v: w[2], u: w[3] });
      if (person.keywords) add(p, "keywords", person.keywords);
      if (person.interests && person.interests !== person.keywords) add(p, "interests", person.interests);
      if (person.bio) add(p, "bio", person.bio);
      for (const t of person.oa_topics || []) add(p, "topic", t);
      if (opts.useListed) for (const a of person.listed || []) add(p, "listed", a);
    });
    const df = new Map();
    let total = 0;
    for (const r of recs) {
      total += r.toks.length;
      r.tf = new Map();
      for (const t of r.toks) r.tf.set(t, (r.tf.get(t) || 0) + 1);
      for (const t of r.tf.keys()) df.set(t, (df.get(t) || 0) + 1);

    const n = index.df.get(t) || 0;
    return Math.log(1 + (index.N - n + 0.5) / (n + 0.5));

  function search(index, query, opts = {}) {
    const q = norm(query).trim();
    const terms = [...new Set(tokens(query))];
    if (!terms.length) return [];
    const kindWeight = opts.kindWeight || KIND_WEIGHT;
    const best = opts.best || BEST;
    // Short queries must be covered closely; a pasted project description
    // (many terms) is scored by BM25 alone.
    const power = opts.power !== undefined ? opts.power : terms.length <= 3 ? 2 : terms.length <= 8 ? 1 : 0;

  // filter never repaints the survivors. Largest group gets slot 1.
  function groupsFor(mode) {
    const key = mode === "area" ? (p) => String(p.area) : (p) => p[mode];
    const counts = d3.rollup(M, (v) => v.length, key);
    const order = [...counts.keys()].sort((a, b) => counts.get(b) - counts.get(a) || String(a).localeCompare(String(b)));
    const label = (k) => {
      if (mode !== "area") return k;
      const a = DATA.areas.find((x) => String(x.id) === k);
      return a && a.label ? a.label : "Area " + (Number(k) + 1);
    };
    return { key, order, counts, label, slot: new Map(order.map((k, i) => [k, i < SLOTS ? i + 1 : 0])) };
  }
  const GROUPS = { department: groupsFor("department"), program: groupsFor("program"), area: groupsFor("area") };

  const DEPTS = [...new Set(P.map((p) => p.department))].sort();
  const SHAPES = ["circle", "square", "triangle", "diamond", "circle", "square"];
  const shapeOf = (p) => SHAPES[DEPTS.indexOf(p.department) % SHAPES.length];

  // ------------------------------------------------------------ state
  const state = {
    colorBy: ["department", "program", "area"].includes(META.color_by) ? META.color_by : "department",
    dept: "",
    rank: "",
    q: "",
    focus: null, // legend group key being highlighted
    sel: null, // selected person index
    hover: null,
  };

  let palette = {};
  function readPalette() {
    palette = { other: css("--other"), ink: css("--ink"), ink2: css("--ink-2"), muted: css("--muted"), surface: css("--surface"), grid: css("--grid"), hi: css("--hi") };
    for (let s = 1; s <= SLOTS; s++) palette[s] = css("--s" + s);
  }
  const colorOf = (p) => {
    const g = GROUPS[state.colorBy];
    const s = g.slot.get(g.key(p));
    return s ? palette[s] : palette.other;
  };

  // ------------------------------------------------------------ search
  // Record-level search (web/search.js): titles, keywords, interests, topics,
  // bio and the department's listed areas; people ranked by their best records.
  const norm = RMSearch.norm;
  const INDEX = RMSearch.buildIndex(P, { useListed: true });
  function search(q, limit) {
    const words = RMSearch.tokens(q);
    if (!words.length) return null;
    const hits = RMSearch.search(INDEX, q, { limit }).map((h) => ({ p: P[h.p], score: h.score, evidence: h.evidence }));
    return { words, hits };
  }
  let result = null;

  const passesFilters = (p) => (!state.dept || p.department === state.dept) && (!state.rank || p.rank === state.rank);
  function isActive(p) {
    if (!passesFilters(p)) return false;
    if (state.focus !== null && GROUPS[state.colorBy].key(p) !== state.focus) return false;
    if (result && !result.set.has(p.i)) return false;
    return true;
  }

  // ------------------------------------------------------------ canvas & zoom
  const canvas = $("map");
  const ctx = canvas.getContext("2d");
  const wrap = canvas.parentElement;
  let W = 0, H = 0, DPR = 1, base = { s: 1, ox: 0, oy: 0 };
  let T = d3.zoomIdentity;
  const PAD = 48;

  function resize() {
    const r = wrap.getBoundingClientRect();
    W = Math.max(200, r.width); H = Math.max(200, r.height);
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    const xs = d3.extent(M, (p) => p.x), ys = d3.extent(M, (p) => p.y);
    // Keep the open legend (top-left) clear of points when there is room beside it.
    const lb = $("legendbox");
    const left = lb.open && W > 700 ? lb.offsetWidth + 24 : PAD;
    const s = Math.min((W - left - PAD) / (xs[1] - xs[0] || 1), (H - 2 * PAD) / (ys[1] - ys[0] || 1));
    base = { s, ox: left + (W - left - PAD - s * (xs[1] - xs[0])) / 2 - s * xs[0], oy: (H - s * (ys[1] - ys[0])) / 2 - s * ys[0] };
    zoom.extent([[0, 0], [W, H]]).translateExtent([[-W, -H], [2 * W, 2 * H]]);
    draw();
  }
  const sx = (x) => T.applyX(base.ox + base.s * x);
  const sy = (y) => T.applyY(base.oy + base.s * y);

  const zoom = d3.zoom().scaleExtent([0.6, 14]).on("zoom", (e) => { T = e.transform; hideTip(); draw(); });
  d3.select(canvas).call(zoom).on("dblclick.zoom", null);
  $("zin").onclick = () => d3.select(canvas).transition().duration(250).call(zoom.scaleBy, 1.6);
  $("zout").onclick = () => d3.select(canvas).transition().duration(250).call(zoom.scaleBy, 1 / 1.6);
  $("zreset").onclick = () => d3.select(canvas).transition().duration(350).call(zoom.transform, d3.zoomIdentity);

  function zoomTo(points, maxK = 4) {
    if (!points.length) return;
    const xs = d3.extent(points, (p) => base.ox + base.s * p.x), ys = d3.extent(points, (p) => base.oy + base.s * p.y);
    const w = Math.max(xs[1] - xs[0], 40), h = Math.max(ys[1] - ys[0], 40);
    const panelSafe = W > 500 ? 0.7 : 0.8;
    const k = Math.min(maxK, panelSafe * Math.min(W / w, H / h));
    const cx = (xs[0] + xs[1]) / 2, cy = (ys[0] + ys[1]) / 2;
    d3.select(canvas).transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * cx, H / 2 - k * cy).scale(k));
  }

  // ------------------------------------------------------------ drawing
  const R = 5.5;
  function marker(x, y, r, shape) {
    ctx.beginPath();
    if (shape === "square") { const a = r * 0.9; ctx.rect(x - a, y - a, 2 * a, 2 * a); }
    else if (shape === "triangle") { const a = r * 1.25; ctx.moveTo(x, y - a); ctx.lineTo(x + a * 0.95, y + a * 0.7); ctx.lineTo(x - a * 0.95, y + a * 0.7); ctx.closePath(); }
    else if (shape === "diamond") { const a = r * 1.2; ctx.moveTo(x, y - a); ctx.lineTo(x + a, y); ctx.lineTo(x, y + a); ctx.lineTo(x - a, y); ctx.closePath(); }
    else ctx.arc(x, y, r, 0, Math.PI * 2);
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const k = T.k;
    const r = R * Math.min(1.6, Math.max(1, Math.sqrt(k) * 0.85));
    const sel = state.sel !== null && !P[state.sel].off ? P[state.sel] : null;

    // Links from the selected person to their nearest people.
    if (sel) {
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = palette.muted;
      ctx.globalAlpha = 0.55;
      for (const n of sel.near.slice(0, 10)) {
        const q = P[n.i];
        ctx.beginPath(); ctx.moveTo(sx(sel.x), sy(sel.y)); ctx.lineTo(sx(q.x), sy(q.y)); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    const nearSet = new Set(sel ? sel.near.map((n) => n.i) : []);
    const order = [...M].sort((a, b) => (isActive(a) - isActive(b)) || (nearSet.has(a.i) - nearSet.has(b.i)));
    for (const p of order) {
      const x = sx(p.x), y = sy(p.y);
      if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
      const active = isActive(p);
      ctx.globalAlpha = active ? 1 : 0.16;
      const col = colorOf(p);
      marker(x, y, r, shapeOf(p));
      if (p.sparse) {
        ctx.fillStyle = palette.surface; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = col; ctx.stroke();
      } else {
        ctx.fillStyle = col; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = palette.surface; ctx.stroke(); // 2px-ish surface ring on overlaps
      }
    }
    ctx.globalAlpha = 1;

    for (const idx of [state.hover, state.sel]) {
      if (idx === null || P[idx].off) continue;
      const p = P[idx];
      marker(sx(p.x), sy(p.y), r + 4, "circle");
      ctx.lineWidth = 2; ctx.strokeStyle = palette.hi; ctx.stroke();
    }

    drawLabels(k, r);
  }

  function drawLabels(k, r) {
    const boxes = [];
    const fits = (b) => !boxes.some((o) => b.x < o.x + o.w && b.x + b.w > o.x && b.y < o.y + o.h && b.y + b.h > o.y);
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    const label = (text, x, y, font, color, align = "center") => {
      ctx.font = font;
      const w = ctx.measureText(text).width;
      const bx = align === "center" ? x - w / 2 : x;
      const b = { x: bx - 3, y: y - 9, w: w + 6, h: 18 };
      if (b.x < 0 || b.x + b.w > W || b.y < 0 || b.y + b.h > H || !fits(b)) return false;
      boxes.push(b);
      ctx.textAlign = align;
      ctx.lineWidth = 4; ctx.strokeStyle = palette.surface; ctx.strokeText(text, x, y);
      ctx.fillStyle = color; ctx.fillText(text, x, y);
      return true;
    };

    // Selected and hovered names always win the space.
    for (const idx of [state.sel, state.hover]) {
      if (idx === null || P[idx].off) continue;
      const p = P[idx];
      label(p.name, sx(p.x) + r + 7, sy(p.y), "600 13px system-ui, sans-serif", palette.ink, "left");
    }

    if (k < 1.7) {
      for (const a of DATA.areas) if (a.label) label(a.label, sx(a.x), sy(a.y), "650 13px system-ui, sans-serif", palette.ink);
    } else if (k < 3.2) {
      for (const a of DATA.topics) if (a.label && a.n > 1) label(a.label, sx(a.x), sy(a.y), "600 12px system-ui, sans-serif", palette.ink2);
    }
    if (k >= 2.4) {
      const visible = M.filter((p) => isActive(p) && sx(p.x) > 0 && sx(p.x) < W && sy(p.y) > 0 && sy(p.y) < H);
      if (k >= 3.2 || visible.length < 40) {
        for (const p of visible) label(p.name, sx(p.x) + r + 5, sy(p.y), "12px system-ui, sans-serif", palette.ink2, "left");
      }
    }
  }

  // ------------------------------------------------------------ hit testing & tooltip
  function hit(mx, my) {
    let best = null, bd = 14 * 14;
    for (const p of M) {
      const dx = sx(p.x) - mx, dy = sy(p.y) - my, d = dx * dx + dy * dy;
      if (d < bd && (isActive(p) || d < 36)) { bd = d; best = p; }
    }
    return best;
  }
  const tip = $("tip");
  function showTip(p, mx, my) {
    tip.innerHTML = `<b>${esc(p.name)}</b><span class="k">${esc(p.title)} · ${esc(p.program)}</span><div>${esc((p.keywords || p.interests || p.terms.join(", ")).slice(0, 160))}</div>`;
    tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = mx + 14, y = my + 14;
    if (x + tw > W - 8) x = mx - tw - 14;
    if (y + th > H - 8) y = my - th - 14;
    tip.style.left = Math.max(4, x) + "px"; tip.style.top = Math.max(4, y) + "px";
  }
  function hideTip() { tip.hidden = true; }

  canvas.addEventListener("pointermove", (e) => {
    if (e.buttons) return;
    const r = canvas.getBoundingClientRect();
    const p = hit(e.clientX - r.left, e.clientY - r.top);
    const idx = p ? p.i : null;
    canvas.classList.toggle("pointing", !!p);
    if (idx !== state.hover) { state.hover = idx; draw(); }
    if (p) showTip(p, e.clientX - r.left, e.clientY - r.top); else hideTip();
  });
  canvas.addEventListener("pointerleave", () => { state.hover = null; hideTip(); draw(); });
  canvas.addEventListener("click", (e) => {
    const r = canvas.getBoundingClientRect();
    const p = hit(e.clientX - r.left, e.clientY - r.top);
    select(p ? p.i : null);
  });

  // ------------------------------------------------------------ panel
  const panel = $("panel");
  function chips(list) { return list.length ? `<ul class="chips">${list.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : ""; }
  // Highlight words that start with a query stem ("network" marks "networks").
  function hl(text, words) {
    let out = esc(text);
    for (const w of words || []) {
      if (w.length < 2) continue;
      out = out.replace(new RegExp("\\b(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-z]*)", "gi"), "<mark>$1</mark>");
    }
    return out;
  }

  function renderOverview() {
    const n = M.length;
    const areas = DATA.areas.filter((a) => a.label).map((a) =>
      `<li><button type="button" data-area="${a.id}"><span class="who">${esc(a.label)}</span><span class="score">${a.n}</span></button></li>`).join("");
    panel.innerHTML = `
      <h2>${esc(META.name)}</h2>
      <p class="sub muted">${n} faculty · as of ${esc(META.as_of)}</p>
      <p>Each point is a faculty member. People who describe similar research sit close together. Click a point to see that person's research and the ten people closest to them.</p>
      <p class="muted">Shapes mark departments. Hollow points have few publications and little profile text to go on, so their position is less certain.</p>
      <h3>Find advisors for a project</h3>
      <form id="projectform" class="project">
        <label class="sr" for="project">Project description</label>
        <textarea id="project" rows="4" placeholder="Paste a project idea or call for proposals, e.g. low-cost sensors to monitor stream water quality with machine learning"></textarea>
        <button type="submit">Find people</button>
      </form>
      <h3>Research areas (computed)</h3>
      <ul class="near">${areas}</ul>
      ${META.left_off.length ? `<p class="muted">Not on the map, because there is no research or teaching text or matched publication for them (they can still be found by search): ${META.left_off.map(esc).join(", ")}.</p>` : ""}
      <h3>How this map is made</h3>
      <p class="bio">${esc(META.method)}</p>
      <p class="bio">Sources: ${META.sources.map((u) => `<a href="${esc(u)}">${esc(u.replace(/^https?:\/\//, ""))}</a>`).join(", ")}. Corrections go to the directory page; the map is rebuilt from it.</p>`;
    $("projectform").onsubmit = (e) => {
      e.preventDefault();
      const text = $("project").value.trim();
      if (text) runProject(text);
    };
    panel.querySelectorAll("[data-area]").forEach((b) => b.onclick = () => {
      const id = Number(b.dataset.area);
      setColorBy("area");
      state.focus = String(id);
      renderLegend(); draw();
      zoomTo(M.filter((p) => p.area === id), 3);
    });
  }

  function renderPerson(p) {
    const links = [`<a href="${esc(p.url)}" target="_blank" rel="noopener">Directory profile</a>`]
      .concat(p.links.map((l) => `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.text)}</a>`))
      .concat(p.orcid ? [`<a href="https://orcid.org/${esc(p.orcid)}" target="_blank" rel="noopener">ORCID</a>`] : [])
      .concat(p.openalex.map((a, k) => `<a href="https://openalex.org/${esc(a)}" target="_blank" rel="noopener">OpenAlex${p.openalex.length > 1 ? " " + (k + 1) : ""}</a>`));
    const works = p.pubs.slice(0, 8).map(([t, y, v, u]) =>
      `<li><a href="${esc(u)}" target="_blank" rel="noopener">${hl(t, result ? result.words : [])}</a><span class="why">${esc(y || "")}${v ? " · " + esc(v) : ""}</span></li>`).join("");
    const co = (p.coauthors || []).map(([j, n]) =>
      `<li><button type="button" data-i="${j}"><span class="who">${esc(P[j].name)}</span><span class="score">${n} paper${n === 1 ? "" : "s"}</span></button></li>`).join("");
    const near = p.near.map((n) => {
      const q = P[n.i];
      const why = n.t.length ? "shared: " + n.t.join(", ") : esc(q.keywords || q.interests).slice(0, 90);
      return `<li><button type="button" data-i="${q.i}"><span class="who">${esc(q.name)}</span><span class="score">${q.department === p.department ? "" : esc(q.department)}</span><span class="why">${esc(q.program)} · ${esc(why)}</span></button></li>`;
    }).join("");
    const words = result ? result.words : [];
    panel.innerHTML = `
      <div class="card">
        <button type="button" class="ghost back" id="back">← ${result ? "Back to results" : "Overview"}</button>
        <h2>${esc(p.name)}</h2>
        <p class="sub">${esc(p.title)} · ${esc(p.program)}${p.program !== p.department ? " (" + esc(p.department) + ")" : ""}</p>
        ${p.keywords ? `<h3>Research (directory)</h3><p>${hl(p.keywords, words)}</p>` : ""}
        ${p.interests && p.interests !== p.keywords ? `<h3>Research interests (profile)</h3><p>${hl(p.interests, words)}</p>` : ""}
        ${p.listed.length ? `<h3>Listed research areas</h3>${chips(p.listed)}` : ""}
        ${p.off ? `<p class="muted">Not on the map: the directory and profile pages have no research or teaching text for this person, and no publications were matched.</p>` : ""}
        ${p.terms.length ? `<h3>Distinctive terms</h3>${chips(p.terms)}` : ""}
        ${p.oa_topics.length ? `<h3>Publication topics (OpenAlex)</h3>${chips(p.oa_topics)}` : ""}
        ${p.off ? "" : `<h3>Closest people</h3>${near ? `<ul class="near">${near}</ul>` : `<p class="muted">No one is close enough to show: this person's research is unlike the rest of the school's.</p>`}`}
        ${co ? `<h3>Co-authors on this map</h3><ul class="near">${co}</ul>` : ""}
        ${p.pubs.length ? `<h3>Recent publications <span class="count">(${p.n_works} since 2011)</span></h3><ul class="pubs">${works}</ul>` : ""}
        ${p.bio ? `<h3>Bio</h3><p class="bio">${hl(p.bio, words)}</p>` : ""}
        <h3>Links</h3><div class="links">${links.join("")}</div>
        ${p.sparse && !p.off ? `<p class="muted" style="margin-top:12px">Few publications and little profile text are available for this person, so the position is approximate.</p>` : ""}
      </div>`;
    $("back").onclick = () => select(null);
    panel.querySelectorAll("[data-i]").forEach((b) => b.onclick = () => select(Number(b.dataset.i), true));
    panel.scrollTop = 0;
  }

  const KIND_LABEL = { title: "paper", keywords: "directory", interests: "profile", bio: "bio", topic: "topic", listed: "listed area" };
  function evidenceLine(r, words) {
    const label = r.kind === "title" ? `${r.y || ""}${r.v ? " · " + r.v : ""}` : KIND_LABEL[r.kind];
    const text = hl(r.text.length > 170 ? r.text.slice(0, 170) + "…" : r.text, words);
    return `<span class="ev"><span class="evk">${esc(label)}</span> ${text}</span>`;
  }

  function renderHits() {
    const project = result.mode === "project";
    const shown = result.hits.filter((h) => passesFilters(h.p));
    const head = project
      ? `<h2>Possible advisors</h2><p class="sub muted">Top ${shown.length} for your project description${state.dept || state.rank ? ", within the filters" : ""}. Ranked by matching publications and profile text; read the evidence before contacting anyone.</p>
         <button type="button" class="ghost back" id="clearproject">← Overview</button>`
      : `<h2>${shown.length} match${shown.length === 1 ? "" : "es"}</h2>
         <p class="sub muted">for “${esc(state.q)}”${state.dept || state.rank ? " within the filters" : ""}. Each result shows the records that matched.</p>`;
    panel.innerHTML = head + `
      <ul class="hits">${shown.map(({ p, evidence }) => {
        const ev = evidence.slice(0, project ? 3 : 2).map((r) => evidenceLine(r, result.words)).join("");
        return `<li><button type="button" data-i="${p.i}"><b>${hl(p.name, result.words)}</b> <span class="muted">${esc(p.program)}${p.off ? " · not on map" : ""}</span>${ev}</button></li>`;
      }).join("")}</ul>
      ${shown.length ? "" : `<p class="muted">No one matches. Try a broader word, or clear the filters.</p>`}`;
    panel.querySelectorAll("[data-i]").forEach((b) => b.onclick = () => select(Number(b.dataset.i), true));
    if (project) $("clearproject").onclick = () => { result = null; state.q = ""; renderPanel(); draw(); };
  }

  function runProject(text) {
    const r = search(text, 10);
    $("q").value = "";
    state.q = text;
    result = r ? { ...r, set: new Set(r.hits.map((h) => h.p.i)), mode: "project" } : null;
    state.sel = null;
    renderPanel(); draw();
    if (result && result.hits.length) zoomTo(result.hits.map((h) => h.p).filter((p) => !p.off), 3);
  }

  function renderPanel() {
    if (state.sel !== null) renderPerson(P[state.sel]);
    else if (result) renderHits();
    else renderOverview();
  }

  function select(i, pan = false) {
    state.sel = i;
    try { history.replaceState(null, "", i === null ? location.pathname + location.search : "#p=" + encodeURIComponent(P[i].id)); } catch (_) { /* file:// in some browsers */ }
    renderPanel(); draw();
    if (i !== null && pan && !P[i].off) {
      const p = P[i];
      zoomTo([p, ...p.near.slice(0, 5).map((n) => P[n.i])], 4);
    }
  }

  // ------------------------------------------------------------ legend
  const legend = $("legend");
  function swatch(color, shape, hollow = false) {
    const s = 14, c = s / 2;
    const fill = hollow ? "none" : color, stroke = color;
    let el;
    if (shape === "square") el = `<rect x="2.5" y="2.5" width="9" height="9"/>`;
    else if (shape === "triangle") el = `<polygon points="${c},1.5 12.5,11.5 1.5,11.5"/>`;
    else if (shape === "diamond") el = `<polygon points="${c},1 13,${c} ${c},13 1,${c}"/>`;
    else el = `<circle cx="${c}" cy="${c}" r="5"/>`;
    return `<svg width="${s}" height="${s}" aria-hidden="true"><g fill="${fill}" stroke="${stroke}" stroke-width="${hollow ? 2 : 0}">${el}</g></svg>`;
  }
  function renderLegend() {
    const g = GROUPS[state.colorBy];
    const shown = g.order.filter((k) => g.slot.get(k));
    const rest = g.order.filter((k) => !g.slot.get(k));
    const rows = shown.map((k) => {
      const shape = state.colorBy === "department" ? shapeOf({ department: k }) : "circle";
      return `<button type="button" data-k="${esc(k)}" aria-pressed="${state.focus === k}">${swatch(palette[g.slot.get(k)], shape)}<span>${esc(g.label(k))}</span><span class="n">${g.counts.get(k)}</span></button>`;
    });
    if (rest.length) rows.push(`<div class="note">${swatch(palette.other, "circle")} Other: ${rest.length} smaller groups</div>`);
    const shapes = state.colorBy === "department" ? "" :
      `<div class="note">${DEPTS.map((d) => swatch(palette.ink2, shapeOf({ department: d })) + " " + esc(d)).join("<br>")}</div>`;
    legend.innerHTML = rows.join("") + shapes + `<div class="note">${swatch(palette.ink2, "circle", true)} few publications, little text</div>`;
    legend.querySelectorAll("[data-k]").forEach((b) => b.onclick = () => {
      state.focus = state.focus === b.dataset.k ? null : b.dataset.k;
      renderLegend(); draw();
    });
  }

  // ------------------------------------------------------------ controls
  function setColorBy(mode) {
    state.colorBy = mode; state.focus = null;
    $("colorby").value = mode;
    renderLegend(); draw();
  }
  $("colorby").value = state.colorBy;
  $("colorby").onchange = (e) => setColorBy(e.target.value);

  for (const d of DEPTS) $("dept").insertAdjacentHTML("beforeend", `<option>${esc(d)}</option>`);
  for (const r of ["Professor", "Associate Professor", "Assistant Professor", "Teaching track", "Other"]) {
    const n = P.filter((p) => p.rank === r).length;
    if (n) $("rank").insertAdjacentHTML("beforeend", `<option value="${r}">${r} (${n})</option>`);
  }
  $("dept").onchange = (e) => { state.dept = e.target.value; renderPanel(); draw(); };
  $("rank").onchange = (e) => { state.rank = e.target.value; renderPanel(); draw(); };

  let qTimer = null;
  $("q").addEventListener("input", (e) => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      state.q = e.target.value.trim();
      const r = search(state.q);
      result = r ? { ...r, set: new Set(r.hits.map((h) => h.p.i)), mode: "search" } : null;
      state.sel = null;
      renderPanel(); draw();
      if (result && result.hits.length) zoomTo(result.hits.map((h) => h.p).filter((p) => passesFilters(p) && !p.off), 3);
    }, 160);
  });
  $("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && result && result.hits.length) select(result.hits[0].p.i, true);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.activeElement !== $("q")) select(null);
  });

  function applyTheme(t) {
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    readPalette(); renderLegend(); themeLabel(); draw();
  }
  function themeLabel() {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    $("theme").textContent = dark ? "Light" : "Dark";
    $("theme").setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
  }
  $("theme").onclick = () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    try { localStorage.setItem("rm-theme", next); } catch (_) { /* storage blocked */ }
    applyTheme(next);
  };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readPalette(); renderLegend(); draw(); });

  // ------------------------------------------------------------ start
  $("title").textContent = META.name + " research map";
  $("subtitle").textContent = `${M.length} faculty · built ${META.as_of} from public directory pages and OpenAlex`;
  $("foot").innerHTML = `Data: public ${esc(META.university)} directory and profile pages, and publications from <a href="https://openalex.org">OpenAlex</a>, as of ${esc(META.as_of)}. Not a ranking or evaluation of anyone. Model: ${esc(META.model)}.`;

  let saved = null;
  try { saved = localStorage.getItem("rm-theme"); } catch (_) { /* storage blocked */ }
  if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
  readPalette();
  themeLabel();
  renderLegend();
  if (window.innerWidth < 820) $("legendbox").open = false;
  $("legendbox").addEventListener("toggle", resize);
  new ResizeObserver(resize).observe(wrap);
  resize();
  const m = location.hash.match(/p=([^&]+)/);
  const start = m ? P.find((p) => p.id === decodeURIComponent(m[1])) : null;
  if (start) select(start.i, true); else renderPanel();
  window.__rm = { state, P, select, runProject, search: (q) => { $("q").value = q; $("q").dispatchEvent(new Event("input")); } };
})();
</script>
</body>
</html>
