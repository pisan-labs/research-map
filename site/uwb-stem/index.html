<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UW Bothell School of STEM research map</title>
<style>:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --raised: #ffffff;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --grid: #e1e0d9;
  --line: #c3c2b7;
  --ring: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --hi: #0b0b0b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --other: #a3a19a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #242422;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9d9b94;
    --grid: #2c2c2a; --line: #383835; --ring: rgba(255, 255, 255, 0.10);
    --accent: #3987e5; --hi: #f0efec;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --other: #6f6d68;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --raised: #242422;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9d9b94;
  --grid: #2c2c2a; --line: #383835; --ring: rgba(255, 255, 255, 0.10);
  --accent: #3987e5; --hi: #f0efec;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --other: #6f6d68;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
}
h1 { font-size: 18px; margin: 0; font-weight: 650; }
h2 { font-size: 17px; margin: 0 0 2px; font-weight: 650; }
h3 { font-size: 12px; margin: 16px 0 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
p { margin: 0 0 8px; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.bar {
  display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: end; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--grid); background: var(--surface);
}
.brand p { margin: 0; font-size: 12px; }
.titlerow { display: flex; align-items: center; gap: 10px; }
button.small { min-height: 28px; padding: 2px 10px; font-size: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; flex: 1 1 520px; justify-content: flex-end; }
.field { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }
.field.grow { flex: 1 1 240px; max-width: 420px; }
input, select, button {
  font: inherit; color: var(--ink); background: var(--raised);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 34px;
}
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, canvas:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
button { cursor: pointer; }
button.ghost { background: transparent; }

.layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
.mapwrap { position: relative; min-height: 420px; background: var(--surface); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map.pointing { cursor: pointer; }
.panel {
  border-left: 1px solid var(--grid); background: var(--surface);
  padding: 14px 16px 24px; overflow-y: auto; min-height: 0;
}
.foot { padding: 8px 16px; font-size: 12px; border-top: 1px solid var(--grid); background: var(--surface); }

.tip {
  position: absolute; pointer-events: none; z-index: 5; max-width: 280px;
  background: var(--raised); color: var(--ink); border: 1px solid var(--ring);
  border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .14);
}
.tip b { display: block; font-size: 13px; }
.tip .k { color: var(--ink-2); }

.zoombtns { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoombtns button { width: 34px; height: 34px; padding: 0; font-size: 17px; line-height: 1; background: var(--raised); }

.legend {
  position: absolute; left: 12px; top: 12px; width: 250px; max-width: calc(100% - 24px);
  background: var(--raised); border: 1px solid var(--ring); border-radius: 8px;
  padding: 6px 10px; font-size: 12px; max-height: calc(100% - 24px); overflow-y: auto;
}
.legend summary { cursor: pointer; font-weight: 600; color: var(--ink-2); padding: 2px 0; }
.legend:not([open]) { width: auto; }
.legend button {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  border: 0; background: none; padding: 3px 4px; min-height: 26px; border-radius: 4px; color: var(--ink);
}
.legend button:hover, .legend button[aria-pressed="true"] { background: var(--grid); }
.legend svg { flex: none; }
.legend .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend .note { color: var(--muted); margin-top: 4px; }

.card .sub { color: var(--ink-2); margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none; }
.chips li { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--ink-2); }
.near { list-style: none; margin: 0; padding: 0; }
.near li { border-top: 1px solid var(--grid); }
.near button {
  width: 100%; text-align: left; border: 0; background: none; padding: 7px 2px; border-radius: 0;
  display: grid; grid-template-columns: 1fr auto; gap: 0 8px;
}
.near button:hover { background: var(--grid); }
.near .who { font-weight: 550; }
.near .why { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.near .score { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pubs { list-style: none; margin: 0; padding: 0; }
.pubs li { border-top: 1px solid var(--grid); padding: 6px 0; font-size: 13px; }
.pubs .why { display: block; font-size: 12px; color: var(--muted); }
h3 .count { text-transform: none; letter-spacing: 0; font-weight: 400; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.bio { color: var(--ink-2); font-size: 13px; }
.hits { list-style: none; margin: 0; padding: 0; }
.hits li { border-top: 1px solid var(--grid); }
.hits button { width: 100%; text-align: left; border: 0; background: none; padding: 8px 2px; border-radius: 0; }
.hits button:hover { background: var(--grid); }
.hits .why { display: block; font-size: 12px; color: var(--muted); }
mark { background: color-mix(in srgb, var(--s4) 35%, transparent); color: inherit; border-radius: 2px; }
.back { margin-bottom: 10px; }

@media (max-width: 820px) {
  body { display: block; height: auto; }
  .bar { padding: 10px 16px; gap: 8px; }
  h1 { font-size: 16px; }
  #subtitle { display: none; }
  .titlerow { justify-content: space-between; }
  .layout { display: block; }
  .mapwrap { height: 70vh; min-height: 360px; }
  .panel { border-left: 0; border-top: 1px solid var(--grid); overflow: visible; }
  .controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; flex: none; }
  .field.grow { grid-column: 1 / -1; max-width: none; }
  select { width: 100%; min-width: 0; }
  .legend { width: auto; max-width: 70%; max-height: 50%; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <div class="titlerow">
      <h1 id="title"></h1>
      <button id="theme" class="ghost small" type="button">Dark</button>
    </div>
    <p id="subtitle" class="muted"></p>
  </div>
  <div class="controls" role="search">
    <label class="field grow">
      <span class="sr">Search people and topics</span>
      <input id="q" type="search" placeholder="Search a name or topic, e.g. machine learning" autocomplete="off">
    </label>
    <label class="field">
      <span>Department</span>
      <select id="dept"><option value="">All</option></select>
    </label>
    <label class="field">
      <span>Rank</span>
      <select id="rank"><option value="">All</option></select>
    </label>
    <label class="field">
      <span>Colour by</span>
      <select id="colorby">
        <option value="department">Department</option>
        <option value="program">Program</option>
        <option value="area">Research area (computed)</option>
      </select>
    </label>
  </div>
</header>
<main class="layout">
  <section class="mapwrap" aria-label="Research map">
    <canvas id="map"></canvas>
    <div id="tip" class="tip" role="tooltip" hidden></div>
    <div class="zoombtns">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zreset" aria-label="Reset view">⟲</button>
    </div>
    <details id="legendbox" class="legend" open>
      <summary>Legend</summary>
      <div id="legend"></div>
    </details>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>
<footer class="foot muted" id="foot"></footer>

o biotechnology by strengthening partnerships between students, faculty and the regional life sciences industry. His work focuses on expanding career awareness, developing industry-relevant and contextualized learning experiences and creating experiential opportunities that prepare students for careers in biotechnology and the life sciences.","listed":[],"url":"https://www.uwb.edu/faculty/guy-hamilton/","links":[],"orcid":"","openalex":[],"n_works":0,"works":[],"titles":[],"oa_topics":[],"x":0.6185,"y":0.3121,"area":7,"topic":8,"terms":["biotechnology","workforce","life","center","career","biology","shoreline community","strengthening"],"sparse":false,"near":[{"i":59,"s":0.313,"t":[]},{"i":68,"s":0.301,"t":[]},{"i":5,"s":0.266,"t":[]}],"coauthors":[]},{"id":"kristina-hillesland","name":"Kristina Hillesland","title":"Associate Professor & Department Chair","department":"Biological Sciences","program":"Biological Sciences","keywords":"evolutionary biology and microbiology","interests":"Imagine that you could collect living samples of species like wolves or flowering plants from the ancient past and then transport them to the current time and compare them directly by watching them run or grow side-by-side. My research program does this sort of comparison using microorganisms, which we have propagated in the lab for 5000 generations. We kept intermediates in the freezer and can revive them and study them together in the same experiment. The goal of this research is to understand how evolution is affected by interactions between species, like predator-prey, competition, and mutualism. What kinds of characteristics do species get from evolving with other species? How does this affect the diversity of species? How does it affect the process of evolution? We do this work by measuring the growth of evolved species and other traits, by sequencing their DNA to find the mutations that occured, and by making mutants that we can use to test hypotheses about which characters changed and why.","bio":"Dr. Kristina Hillesland earned her Ph.D. in Microbiology and Molecular Genetics at Michigan State University, where she studied microbial evolution. She then expanded her skills as a postdoctoral scholar in environmental microbiology in the Civil and Environmental Engineering department at UW Seattle before beginning her faculty position at UW Bothell in 2011, where she enjoys conveying complex subjects to undergraduate students and mentoring undergraduate research. Her research was recognized nationally through her receipt of the prestigious NSF CAREER award, and she was also honored by being selected as one of seven recipients of the 2016 University of Washington Research Mentor Award. Dr. Hillesland’s research is in the area of evolutionary biology and microbiology, she has published 15 peer-reviewed papers, a book chapter and a magazine article.","listed":["Ecology, Evolution and Behavior","Genomic and Bioinformatics","Microbiology, Molecular and Cellular Biology"],"url":"https://www.uwb.edu/faculty/kristina-hillesland/","links":[{"text":"Hillesland lab","href":"https://sites.google.com/a/uw.edu/hillesland-lab/the-hillesland-lab?authuser=0"}],"orcid":"","openalex":["A5044235172"],"n_works":14,"works":[{"t":"Synergistic epistasis enhances the co-operativity of mutualistic interspecies interactions","y":2021,"v":"The ISME Journal","u":"https://doi.org/10.1038/s41396-021-00919-9"},{"t":"Evolution on the bright side of life: microorganisms and the evolution of mutualism","y":2017,"v":"Annals of the New York Academy of Sciences","u":"https://doi.org/10.1111/nyas.13515"},{"t":"Key Metabolites and Mechanistic Changes for Salt Tolerance in an Experimentally Evolved Sulfate-Reducing Bacterium, Desulfovibrio vulgaris","y":2017,"v":"mBio","u":"https://doi.org/10.1128/mbio.01780-17"},{"t":"Mechanism for microbial population collapse in a fluctuating resource environment","y":2017,"v":"Molecular Systems Biology","u":"https://doi.org/10.15252/msb.20167058" s then teach them how to navigate and evaluate the plethora of information that is available as they explore those issues independently. She recently spearheaded a project to implement Classroom Undergraduate Research Experiences (CUREs) in our introductory labs. She has experience teaching a wide variety of courses focusing on cell and molecular biology. Lewis has also been very active in curriculum management, and she served as the chair of the Division of Biological Sciences five years from 2019-2024.","listed":[],"url":"https://www.uwb.edu/faculty/alaron-lewis/","links":[],"orcid":"","openalex":["A5111386997"],"n_works":5,"works":[{"t":"Identification of amacrine subtypes that express the atypical cadherin celsr3","y":2014,"v":"Experimental Eye Research","u":"https://doi.org/10.1016/j.exer.2014.12.003"},{"t":"Examining the role of celsr3 in amacrine cell development in the zebrafish retina","y":2013,"v":"Investigative Ophthalmology & Visual Science","u":"https://openalex.org/W2992304798"},{"t":"Calcium fluxes in degenerating pde6cw59 mutant zebrafish cones indicate a non-apoptotic mechanism of cell death","y":2013,"v":"Investigative Ophthalmology & Visual Science","u":"https://openalex.org/W843838068"},{"t":"Celsr3 Is Required for Normal Development of GABA Circuits in the Inner Retina","y":2011,"v":"PLoS Genetics","u":"https://doi.org/10.1371/journal.pgen.1002239"},{"t":"Signal Dependent Redistribution of Heterotrimeric G Proteins in Zebrafish","y":2011,"v":"Investigative Ophthalmology & Visual Science","u":"https://openalex.org/W977841438"}],"titles":["Identification of amacrine subtypes that express the atypical cadherin celsr3","Examining the role of celsr3 in amacrine cell development in the zebrafish retina","Calcium fluxes in degenerating pde6cw59 mutant zebrafish cones indicate a non-apoptotic mechanism of cell death","Celsr3 Is Required for Normal Development of GABA Circuits in the Inner Retina","Signal Dependent Redistribution of Heterotrimeric G Proteins in Zebrafish"],"oa_topics":["Retinal Development and Disorders","Receptor Mechanisms and Signaling"],"x":0.9357,"y":0.4231,"area":2,"topic":1,"terms":["retinal","disorders","receptor mechanisms","signaling"],"sparse":false,"near":[{"i":9,"s":0.462,"t":[]},{"i":6,"s":0.381,"t":[]},{"i":7,"s":0.376,"t":[]},{"i":79,"s":0.349,"t":[]},{"i":77,"s":0.329,"t":[]},{"i":3,"s":0.294,"t":[]},{"i":10,"s":0.272,"t":[]},{"i":2,"s":0.266,"t":[]}],"coauthors":[]},{"id":"rick-mclaughlin","name":"Rick McLaughlin","title":"Assistant Professor","department":"Biological Sciences","program":"Biological Sciences","keywords":"Genome evolution, genomic innovation, host/pathogen interactions, transposable elements","interests":"Our research program investigates how genomes function in the presence of vast amounts of repetitive DNA, particularly transposable elements (TEs) and retrocopy-derived genes, and how these elements influence cellular processes, immune signaling, and evolutionary change. Although originally dismissed as “junk,” repetitive sequences shape genome structure, gene regulation, mutation rates, and host–pathogen interactions. They also provide accessible avenues for undergraduate research: the questions are compelling (sometimes bordering on sci-fi), datasets are abundant and public, and analyses can range from conceptual reasoning to fully computational workflows or low-cost wet-lab experiments. My goal is to build a research program that is simultaneously rigorous, creative, and highly participatory. I envision a lab where undergraduates are the primary drivers of discovery: an environment where students gain experience in the innate immune system, host-pathogen interactions, modern genomics, computational biology, molecular evolution, and hands-on experimental design while contributing to publishable research.","bio":"Dr. Rick McLaughlin studies genome evolution and the interactions between mobile genetic elements and the immune system. His research focuses on transposable elements (DNA sequences that copy themselves within genomes) and the evolutionary conflicts that have shaped them and our cellular defenses. He previously led a research group at the Pacific Northwest Research Institute, trained as a postdoctoral fellow at Fred Hutchinson Cancer Center and received his doctorate from UT Southwestern Medical Center. McLaughlin works to create opportunities for undergraduates to participate directly in scientific discovery. His teaching emphasizes active learning, scientific communication and helping students develop the confidence and skills to think and work as scientists, regardless of their prior experience.","listed":["Ecology, Evolution and Behavior","Genomic and Bioinformatics","Microbiology, Molecular and Cellular Biology"],"url":"https://www.uwb.edu/faculty/rick-mclaughlin/","links":[],"orcid":"","openalex":[],"n_works":0,"works":[],"titles":[],"oa_topics":[],"x":1.0,"y":0.4846,"area":2,"topic":2,"terms":["elements","transposable","repetitive","host","pathogen","immune","genome","interactions"],"sparse":false,"near":[{"i":7,"s":0.673,"t":[]},{"i":3,"s":0.593,"t":["evolution"]},{"i":11,"s":0.486,"t":[]},{"i":9,"s":0.472,"t":[]},{"i":5,"s":0.381,"t":[]},{"i":0,"s":0.37,"t":[]},{"i":74,"s":0.35,"t":["interactions"]},{"i":23,"s":0.322,"t":[]},{"i":79,"s":0.306,"t":[]},{"i":68,"s":0.291,"t":[]}],"coauthors":[]},{"id":"elizabeth-ostrowski","name":"Elizabeth Ostrowski","title":"Assistant Professor","department":"Biological Sciences","program":"Biological Sciences","keywords":"Microbiology, evolutionary genetics and genomics","interests":"Dr. Ostrowski’s research background is in microbiology, evolutionary genetics, and genomics. Broadly, she is interested in how populations evolve and adapt. In the past, her research has combined studies of natural genetic variation with evolution experiments to identify genetic changes in real-time. She also has a longstanding interest in genetic conflict: when the interests of different genetic elements are not aligned. Genetic conflict can occur among different genomes within a cell (e.g., mitochondrial and nuclear genomes), among different cells in a body (e.g., microchimerism), or among different species (e.g., between hosts and their microbiomes). Since her postdoc she has worked with Dictyostelium discoideum, otherwise known as a social amoeba. Dictyostelium is one of a handful of NIH model organisms for biomedical research. It has been used as a model system for cell-cell communication, phagocytosis, neurodegenerative disease, and multicellular development. She has used this organism to study cell-cell genetic conflicts. Her current research interests are focused on human genetic variation and the potential for genetic conflicts during pregnancy. During pregnancy, cells are exchanged between the mother and foetus, which can persist for decades following pregnancy. However, the impact of these foreign cells (termed ‘microchimerism’) on the health of the mother and baby are not yet understood.","bio":"Dr. Elizabeth Ostrowski’s research background is in microbiology, evolutionary genetics and genomics. Her research combines studies of natural populations with laboratory evolution experiments that identify genetic changes in real-time. She has a longstanding interest in genetic conflict, i.e., when the evolutionary interests of different genetic elements are not aligned. Such conflict can occur among different genomes within a cell, among different cells in a body or among different species. It potentially influences diverse processes, from the origins of complex life to health and disease.","listed":["Ecology, Evolution and Behavior","Genomic and Bioinformatics","Microbiology, Molecular and Cellular Biology"],"url":"https://www.uwb.edu/faculty/elizabeth-ostrowski/","links":[{"text":"Lab website","href":"https://www.ostrowski-lab.org/"}],"orcid":"","openalex":["A5070912354"],"n_works":15,"works":[{"t":"A comprehensive assessment of tandem repeat geno  of Washington Bothell, she has mentored undergraduate projects investigating invertebrate communities in the restored North Creek Wetlands on campus, St. Edward State Park through collaboration with the Environmental Education and Research Center (EERC), and other ecosystems across the Pacific Northwest.","bio":"Dr. Michele B. Price is an associate teaching professor in the Department of Biological Sciences at the University of Washington Bothell, where she has taught since 2016. She holds both a master’s and a Ph.D. in Entomology from the University of Wisconsin–Madison. Her teaching focuses on the relationship between form and function in invertebrate and vertebrate animals, and she integrates research-based, hands on learning throughout her courses. Price has mentored numerous undergraduate research projects examining insect biodiversity in the restored North Creek Wetlands on campus, St. Edward State Park (in collaboration with the Environmental Education and Research Center), and other Pacific Northwest ecosystems.","listed":["Anatomy and Physiology"],"url":"https://www.uwb.edu/faculty/michele-price/","links":[],"orcid":"","openalex":[],"n_works":0,"works":[],"titles":[],"oa_topics":[],"x":0.9773,"y":0.5726,"area":2,"topic":2,"terms":["beetles","biodiversity","wetlands","undergraduate projects","state","shaping present","species morphology","systematics"],"sparse":false,"near":[{"i":0,"s":0.436,"t":[]},{"i":3,"s":0.436,"t":[]},{"i":7,"s":0.349,"t":[]},{"i":1,"s":0.341,"t":[]},{"i":11,"s":0.33,"t":[]},{"i":10,"s":0.287,"t":[]}],"coauthors":[]},{"id":"han-wei-shih","name":"Han-Wei Shih","title":"Assistant Professor","department":"Biological Sciences","program":"Biological Sciences","keywords":"molecular mechanisms regulating encystation and antibiotic resistance","interests":"Cell and Molecular Biology","bio":"Dr. Han-Wei Shih is a molecular and cell biologist. His lab investigates how the second messengers cAMP and Ca²⁺ control stage transitions in the waterbor work, empirical software engineering, human-computer interaction, applied machine learning, cybersecurity","interests":"Dr. Champion’s research sits at the intersection of empirical software engineering, information integrity, cybersecurity, and human-computer interaction, using AI / ML / NLP techniques and quantitative modeling alongside qualitative inquiry. She typically examines work done in collaborative settings, with a focus on open source software and open knowledge communities.","bio":"Dr. Kaylea Champion's research investigates how people collaborate to build digital infrastructure, including operating systems, programming languages, and information repositories. What gets made and maintained and secured — and what gets neglected? What risks do we face? What practices lead to better outcomes? How can we work smarter and what can we stop doing? Using quantitative modeling and qualitative analyses, Champion's scholarship seeks to bridge the divide between research and practice, which for her means building relationships with practitioner communities, organizations, and industry to directly share research findings. She is a member of the Community Data Science Collective (refer to website links for their Wiki and blog), which includes members from UW Bothell, UW Seattle, Northwestern, Purdue, University of Idaho, and University of Texas Austin.","listed":["Artificial Intelligence/Machine Learning","Computer Science Education","Cybersecurity","Data Computing/Data Science/Scientific Computing","Human Factors/Human Computer Interaction","Software Engineering"],"url":"https://www.uwb.edu/faculty/kaylea-champion/","links":[{"text":"Community Data Science Collective Wiki","href":"https://wiki.communitydata.science"},{"text":"Community Data Science Collective blog","href":"https://blog.communitydata.science"}],"orcid":"","openalex":["A5032792363"],"n_works":27,"works":[{"t":"Beyond Productivity: AI, Community, and Sustainability in Open Source Software","y":2026,"v":  2015 IGI Global Annual Excellence in Research Journal Award. Chen is currently serving on the IEEE Computer Society (CS) Board of Governors, chairing the IEEE CS Technical Community on Multimedia Computing (IEEE TCMC), and is the associate editor of International Journal of Multimedia Data Engineering and Management (IJMDEM). She was the associate editor of IEEE Transactions on Multimedia (TMM), TPC co-chair for over 15 international conferences/symposiums/workshops, a steering committee member in two international conferences including IEEE ICME, and a key organizer for more than 20 international conferences.","listed":["Artificial Intelligence/Machine Learning","Data Computing/Data Science/Scientific Computing","Graphics, Multimedia, and Computer Games"],"url":"https://www.uwb.edu/faculty/min-chen/","links":[],"orcid":"","openalex":[],"n_works":0,"works":[],"titles":[],"oa_topics":[],"x":0.2731,"y":0.1308,"area":1,"topic":4,"terms":["multimedia","interdisciplinary projects","big","data mining","data analytics","machine learning"],"sparse":false,"near":[{"i":27,"s":0.428,"t":[]},{"i":20,"s":0.391,"t":[]},{"i":29,"s":0.386,"t":["data analytics"]},{"i":40,"s":0.367,"t":["machine learning"]},{"i":28,"s":0.335,"t":[]},{"i":21,"s":0.328,"t":[]},{"i":14,"s":0.316,"t":[]},{"i":32,"s":0.302,"t":[]},{"i":18,"s":0.266,"t":[]}],"coauthors":[]},{"id":"morteza-chini","name":"Morteza Chini","title":"Assistant Teaching Professor","department":"Computing & Software Systems","program":"Computing & Software Systems","keywords":"computer science education, cybersecurity, software engineering","interests":"Current interests extend to agentic AI, exploring how these evolving AI capabilities can be thoughtfully integrated into software systems and human workflows, while maintaining a strong focus on usability, human-AI collaboration and responsible design.","bio":"Dr. Morteza Chini has taught a broad range of courses in the Department of Computing & Software Systems at UW Bothell since 2016. His teaching style emphasizes building professional relationships with learners, fostering a collaborative and supportive environment grounded in cooperation, mentorship and active learning. He connects foundational computing concepts with practical, real-world applications, helping students develop technical confidence and problem-solving skills.","listed":["Computer Science Education","Cybersecurity","Software Engineering"],"url":"https://www.uwb.edu/faculty/morteza-chini/","links":[],"orcid":"","openalex":["A5063762889"],"n_works":1,"works":[{"t":"WIP: Provenance Support for Interdisciplinary Research on the North Creek Wetlands","y":2015,"v":"IEEE International Conference on eScience","u":"https://doi.org/10.1109/escience.2015.57"}],"titles":["WIP: Provenance Support for Interdisciplinary Research on the North Creek Wetlands"],"oa_topics":["Research Data Management Practices"],"x":0.0553,"y":0.1491,"area":3,"topic":9,"terms":["software","thoughtfully","maintaining strong","human-ai","human workflows","capabilities","agentic ai","extend"],"sparse":false,"near":[{"i":18,"s":0.491,"t":["software"]},{"i":14,"s":0.471,"t":[]},{"i":69,"s":0.372,"t":[]},{"i":24,"s":0.345,"t":[]},{"i":32,"s":0.318,"t":[]},{"i":36,"s":0.3,"t":[]},{"i":22,"s":0.299,"t":[]},{"i":39,"s":0.283,"t":["usability"]},{"i":21,"s":0.281,"t":[]},{"i":31,"s":0.28,"t":[]}],"coauthors":[]},{"id":"dharma-dailey","name":"Dharma Dailey","title":"Assistant Teaching Professor","department":"Computing & Software Systems","program":"Computing & Software Systems","keywords":"collaborations between professional software engineers and scientists at the Scientific Software Engineer Center at UW","interests":"Dr. Dailey researches how human-centered design methods can be integrated into data intensive projects to improve process and outcomes. She mentors scientists and students in ways of exploring the social dimensions of technical work. She collaborates with educators across the U.S who are bringing “Data t the University of Washington. Prior to this, he earned an M.A. in Political Science at Western Washington University. His research area is cybersecurity with an emphasis on the human factors of cybersecurity. The primary focus of his research involves the examination of psychological traits and their relationship to the cybersecurity and privacy behavior of individuals. His goal is to both understand behavior as it relates to cybersecurity and privacy and discover what may be done to improve that behavior. He and his collaborators have explored the use of fear appeals, shame, regret, forgiveness, and grace in cybersecurity to engender behavioral change. Additionally, the role of cyber leadership and how it can be improved is an additional area of focus.","listed":["Cybersecurity","Human Factors/Human Computer Interaction"],"url":"https://www.uwb.edu/faculty/marc-dupuis/","links":[{"text":"UW Faculty website","href":"https://faculty.washington.edu/marcjd/"}],"orcid":"","openalex":["A5003202268","A5102725128"],"n_works":124,"works":[{"t":"Individuals Perceptions Related to Privacy and Collection of Data from AI Chatbots","y":2026,"v":"Zenodo (CERN European Organization for Nuclear Research)","u":"https://doi.org/10.5281/zenodo.22850374"},{"t":"Context analysis as a foundational step to inform the design and implementation of an interprofessional primary care model for new long-term medication users - the myCare Start Implementation Science Project","y":2026,"v":"Research in Social and Administrative Pharmacy","u":"https://doi.org/10.1016/j.sapharm.2026.07.007"},{"t":"Use of medications to treat inflammatory bowel diseases before and during pregnancy in Switzerland between 2012 and 2019: an observational study using the claims-based MAMA cohort","y":2026,"v":"BMC Gastroenterology","u":"https://doi.org/10.1186/s12876-026-04925-z"},{"t":"Exploring the Impact of Previous Experience, and Threats Awareness on Influencing Regular Information Backup Among USA Population","y M Tokyo Research Laboratory from 1998 to 1993. During his Ph.D. and PostDoc study at UC Irvine from 1993 to 1997, he focused on software technologies to coordinate parallel and distributed computations, using a navigational autonomy approach. During 1998-2001, he was an assistant professor in the Institute of Information Sciences and Electronics at the University of Tsukuba, where he worked on self-migrating threads to realize parallel execution of multi-agent applications. Fukuda joined the Department of Computing & Software Systems (previously a division) at the University of Washington Bothell in 2001, and initiated an agent-based grid-computing research with NSF's support in 2005-07. He is currently working on multi-agent spatial simulation and agent-based data analysis. His research interests include mobile agents, multi-threading, cluster computing, grid computing, and distributed simulations.","listed":["Parallel, Distributed, Cloud, and Edge Computing"],"url":"https://www.uwb.edu/faculty/munehiro-fukuda/","links":[{"text":"Faculty website","href":"http://faculty.washington.edu/mfukuda/"}],"orcid":"","openalex":["A5090114871"],"n_works":39,"works":[{"t":"Agent-based Parallel Processing of Graph Database Queries","y":2026,"v":"Research Square","u":"https://doi.org/10.21203/rs.3.rs-10639273/v1"},{"t":"An Analysis of Three C/C++ Cluster-Computing Libraries for Agent-Based Models","y":2025,"v":"ACM Transactions on Modeling and Computer Simulation","u":"https://doi.org/10.1145/3732778"},{"t":"Agent-Based Computational Geometry","y":2025,"v":"International Conference on Agents and Artificial Intelligence (ICAART)","u":"https://doi.org/10.5220/0013240800003890"},{"t":"Toward Implementing an Agent-based Distributed Graph Database System","y":2024,"v":"IEEE International Conference on Big Data (BigData)","u":"https://doi.org/10.1109/bigdata62323.2024.10825052"},{"t":"Agent-Based versus Data-Streamed Big-Data Parallelization in Computational Geometry","y":2023,"v":"Res cholar. Pisan has a Ph.D. in Artificial Intelligence from Northwestern University. Before moving to Seattle in 2017, he lived in the Chicago area for 10 years and Sydney for 20 years.","listed":["Computer Science Education","Graphics, Multimedia, and Computer Games"],"url":"https://www.uwb.edu/faculty/yusuf-pisan/","links":[{"text":"Faculty website","href":"https://pisanorg.github.io/yusuf/"}],"orcid":"","openalex":["A5040691713"],"n_works":29,"works":[{"t":"Teaching a Large Language Model Tutor to Withhold the Answer: A Supervisor Architecture and an Evidence-Driven Method for Tuning Socratic Behavior","y":2026,"v":"arXiv (Cornell University)","u":"https://openalex.org/W7203504182"},{"t":"Teaching Intro AI When the Tools Can Do the Homework: A Course Redesign and a Student Bill of Rights","y":2026,"v":"arXiv (Cornell University)","u":"https://doi.org/10.48550/arxiv.2608.05175"},{"t":"Evolution of the Software Toolchain for Computer Science Students","y":2024,"v":"Creative Education","u":"https://doi.org/10.4236/ce.2024.156074"},{"t":"Editorial","y":2017,"v":"Entertainment Computing","u":"https://doi.org/10.1016/j.entcom.2017.05.003"},{"t":"An initial understanding of how game users explore virtual environments","y":2016,"v":"Entertainment Computing","u":"https://doi.org/10.1016/j.entcom.2016.11.003"},{"t":"Understanding players' map exploration styles","y":2016,"v":"Australasian Computer Science Week Multiconference (ACSW)","u":"https://doi.org/10.1145/2843043.2843480"},{"t":"Evaluating the effects of competition vs collaboration on user engagement in an immersive game using natural interaction","y":2015,"v":"ACM Symposium on Virtual Reality Software and Technology (VRST)","u":"https://doi.org/10.1145/2821592.2821643"},{"t":"Inferring Player Experiences Using Facial Expressions Analysis","y":2014,"v":"Australasian Conference On Interactive Entertainment","u":"https://doi.org/10.1145/2677758.2677765"}],"titles":["Teaching a Large Language Model Tutor to Withhold the und developing students' autonomy, in and out of academia. He gives particular attention to choice and responsibility as they are the foundations of autonomy.","listed":["Pure and Theoretical Mathematics"],"url":"https://www.uwb.edu/faculty/alexandre-barchechat/","links":[],"orcid":"","openalex":[],"n_works":0,"works":[],"titles":[],"oa_topics":[],"x":0.2005,"y":0.662,"area":0,"topic":0,"terms":["philosophy","non-western","moral","autonomy","revolves","responsibility","respect","gives"],"sparse":false,"near":[],"coauthors":[]},{"id":"ariana-dundon","name":"Ariana Dundon","title":"Associate Teaching Professor","department":"Engineering & Mathematics","program":"Mathematics","keywords":"actuarial science education","interests":"Actuarial Science Education, Combinatorics, Algebraic Geometry","bio":"Dr. Ariana Dundon is a Pacific Northwest native who earned her Ph.D. in mathematics from the University of Washington. Prior to joining UW Bothell, she taught at Montgomery College in Rockville, MD. She teaches a wide variety of math classes including calculus, probability and statistics, geometry, and financial mathematics. She helped create the Actuarial Science program at UW Bothell and continues to mentor students interested in this field.","listed":["Actuarial Science","Pure and Theoretical Mathematics"],"url":"https://www.uwb.edu/faculty/ariana-dundon/","links":[],"orcid":"","openalex":[],"n_works":0,"works":[],"titles":[],"oa_topics":[],"x":0.2604,"y":0.7971,"area":0,"topic":0,"terms":["actuarial","combinatorics","algebraic geometry","education"],"sparse":false,"near":[{"i":54,"s":0.429,"t":[]},{"i":49,"s":0.426,"t":[]},{"i":53,"s":0.394,"t":[]},{"i":61,"s":0.359,"t":[]},{"i":85,"s":0.355,"t":["education"]},{"i":64,"s":0.346,"t":[]},{"i":50,"s":0.286,"t":[]},{"i":83,"s":0.274,"t":[]},{"i":63,"s":0.265,"t":[]},{"i":59,"s":0.263,"t":[]}],"coauthors":[]},{"id":"elizabeth-field","name":"Elizabeth Field","title":"Assistant Professor","department":"Engineering & Mathematics","program":"Mathematics","keywords":"geometric group theory, geometric topology, and low-dimensional topology","interests":"Dr. Field’s current research projects lie primarily in the intersection of the fields of geometry, topology and algebra. While geometry is concerned with rigid properties of spaces, such as distance and measurements, topology focuses on properties of spaces that remain unchanged when the space is deformed via actions such as twisting, stretching, or shrinking. In one ongoing research project, Field studies topological spaces which include 2-dimensional surfaces (think of the glaze on a donut – this is an example of a surface with one “hole”, known as a torus) and 3-dimensional manifolds. It turns out that certain 3-manifolds can be built from surfaces utilizing a symmetry of the surface and then given a geometry which depends on the symmetry used in the construction. With this geometry, one can then ask questions about the volume of the resultant 3-manifold. Field studies the relationship between the volume of the 3-manifold and the symmetry of the surface used in the construction and uses tools from algebra to formalize these relationships.","bio":"Dr. Elizabeth Field received her B.A. in Mathematics from Southern Connecticut State University, where she also graduated with a B.S. in Elementary and Special Education. She completed her doctoral degree in Mathematics at the University of Illinois at Urbana-Champaign. She went on to work at the University of Utah where she was a NSF Postdoctoral Scholar. Her research interests are in geometric group theory, geometric topology, and low-dimensional topology.","listed":["Pure and Theoretical Mathematics"],"url":"https://www.uwb.edu/faculty/elizabeth-field/","links":[{"text":"Personal website","href":"https://sites.google.com/view/elizabeth-field"}],"orcid":"","openalex":[],"n_works":0,"works":[],"titles":[],"oa_topics":[],"x":0.3598,"y":0.8129,"area":0,"topic":6,"terms":["symmetry","topology","space terests":"","bio":"Dr. Brian Martensen is currently serving as the Executive Vice Chancellor for Academic Affairs at the University of Washington Bothell. Additionally, he holds an appointment as professor of Mathematics. As a faculty member, his research has been in the general area of topological dynamics, focusing on aperiodic tiling spaces, classification of hyperbolic attractors, and mixing properties such systems. His teaching has focused on differential equations, modeling of real-world phenomena, and analysis. In tandem with his administrative work, he also uses techniques in data science to study student outcomes and financial models in higher education.","listed":[],"url":"https://www.uwb.edu/faculty/brian-martensen/","links":[{"text":"LinkedIn","href":"https://www.linkedin.com/in/brian-martensen-b3896718/"}],"orcid":"","openalex":[],"n_works":0,"works":[],"titles":[],"oa_topics":[],"x":0.3118,"y":0.6526,"area":0,"topic":0,"terms":["additionally","administrative","vice","tiling spaces","real-world phenomena","tandem","topological dynamics","holds"],"sparse":false,"near":[{"i":49,"s":0.364,"t":[]},{"i":83,"s":0.322,"t":[]},{"i":60,"s":0.315,"t":[]},{"i":85,"s":0.313,"t":[]},{"i":2,"s":0.313,"t":[]},{"i":64,"s":0.271,"t":[]},{"i":61,"s":0.269,"t":[]},{"i":52,"s":0.263,"t":[]}],"coauthors":[]},{"id":"jennifer-mcloud-mann","name":"Jennifer McLoud-Mann","title":"Dean & Professor","department":"Engineering & Mathematics","program":"Mathematics","keywords":"knot theory; tiling theory; discrete geometry","interests":"","bio":"Dr. Jennifer McLoud-Mann joined UW Bothell as an associate professor with tenure in 2013 when the School of STEM was founded. In addition to being a long-serving faculty member, McLoud-Mann has extensive experience in administrative roles and currently serves as dean of the school. Prior to joining UW Bothell, McLoud-Mann served as associate dean for the College of Arts & Sciences at the University of Texas at Tyler. During her tenure at UW Bothell, she has worked alongside faculty, staff, external partners, and others in campus leadership to create pathways and opportunities for student success. This work was fueled by her own lived experience as a first-generation Native woman from an economically disadvantaged background. Notable achievements in supporting student success include her work in establishing the first NSF-funded REU site at UW Bothell, collaborating with campus leadership to pilot a centralized peer facilitator program, supporting sustainable success of experiential learning activities through infrastructure building and policy making, and leading efforts to put people first by building community that supports wellbeing.","listed":["Pure and Theoretical Mathematics"],"url":"https://www.uwb.edu/faculty/jennifer-mcloud-mann/","links":[],"orcid":"","openalex":["A5004133819"],"n_works":8,"works":[{"t":"Puzzling Pentagons—How Many Ways Can We Cover a Flat Surface?","y":2023,"v":"Frontiers for Young Minds","u":"https://doi.org/10.3389/frym.2023.953114"},{"t":"Nonexpansive directions in the Jeandel-Rao Wang shift","y":2023,"v":"Discrete and Continuous Dynamical Systems","u":"https://doi.org/10.3934/dcds.2023046"},{"t":"Hexagonal mosaic links generated by saturation","y":2020,"v":"Journal of Knot Theory and Its Ramifications","u":"https://doi.org/10.1142/s0218216520500856"},{"t":"Convex pentagons that admit i-block transitive tilings","y":2017,"v":"Geometriae Dedicata","u":"https://doi.org/10.1007/s10711-017-0270-9"},{"t":"Stick numbers in the simple hexagonal lattice","y":2015,"v":"Involve a Journal of Mathematics","u":"https://doi.org/10.2140/involve.2015.8.503"},{"t":"Extending patches to fullerenes","y":2014,"v":"Ars Mathematica Contemporanea","u":"https://doi.org/10.26493/1855-3974.486.28c"},{"t":"THE STICK NUMBER FOR THE SIMPLE HEXAGONAL LATTICE","y":2012,"v":"Journal of Knot Theory and Its Ramifications","u":"https://doi.org/10.1142/s0218216512501209"},{"t":"Side lengths of pseudoconvex f  She has experience teaching a variety of undergraduate mathematics courses for pre-majors and math majors, as well as courses for practicing and pre-service teachers. As a first-generation college student who began at a community college, Dr. Theakston Musselman is passionate about finding ways to support students who are traditionally underserved and underrepresented within collegiate mathematics. Because mathematics, in particular, has served as a gatekeeper to advanced educational and work opportunities for many students of color and young women, her motivation as a teacher and mathematics education researcher is to provide access to meaningful experiences in mathematics for those students.","listed":["Mathematics Education"],"url":"https://www.uwb.edu/faculty/alexandria-musselman/","links":[],"orcid":"","openalex":[],"n_works":0,"works":[],"titles":[],"oa_topics":[],"x":0.1947,"y":0.7923,"area":0,"topic":0,"terms":["mathematics","undergraduate levels","purposes","secondary","promotion","meaningful","identities","insight"],"sparse":false,"near":[{"i":54,"s":0.67,"t":[]},{"i":50,"s":0.6,"t":[]},{"i":64,"s":0.592,"t":["mathematics"]},{"i":49,"s":0.498,"t":["mathematics"]},{"i":53,"s":0.385,"t":[]},{"i":55,"s":0.367,"t":[]},{"i":52,"s":0.359,"t":[]},{"i":83,"s":0.338,"t":[]},{"i":63,"s":0.307,"t":[]},{"i":85,"s":0.274,"t":[]}],"coauthors":[]},{"id":"clark-musselman","name":"Clark Musselman","title":"Associate Teaching Professor","department":"Engineering & Mathematics","program":"Mathematics","keywords":"mathematical physics; applied analysis; functional analysis","interests":"","bio":"Dr. Clark Musselman received his Ph.D. in applied mathematics from Michigan State University (MSU). He also holds a M.S. in mathematics from Oregon State University and a B.S. in physics and mathematics from Clarkson University. Previously, he taught in both the Mathematics and Physics departments at Western Washington University. Additionally, he spent two years at Bard College at Simon’s Rock, an early college in the Berkshire mountains of Western Massachusetts, where he taught all levels of undergraduate mathematics. His scholarly work in mathematical physics and applied analysis uses Markov processes, semigroups, and spectral theory to understand the influence of disorder in physical models. His primary goals as a mathematics teacher are to improve the confidence of his students by working through difficult ideas in supportive environments and, relatedly, to empower them to set high standards for themselves. Further, he aims to instill a sense of curiosity and commitment so that they may meet or exceed their personal goals both in college and after graduation.","listed":["Actuarial Science","Applied and Computational Mathematics"],"url":"https://www.uwb.edu/faculty/clark-musselman/","links":[],"orcid":"","openalex":["A5001866771"],"n_works":1,"works":[{"t":"Diffusive scaling for all moments of the Markov Anderson model","y":2013,"v":"arXiv (Cornell University)","u":"https://doi.org/10.48550/arxiv.1312.2603"}],"titles":["Diffusive scaling for all moments of the Markov Anderson model"],"oa_topics":["Spectral Theory in Mathematical Physics"],"x":0.4187,"y":0.7265,"area":0,"topic":6,"terms":["mathematical physics","spectral","functional","applied"],"sparse":false,"near":[{"i":63,"s":0.424,"t":[]},{"i":54,"s":0.386,"t":[]},{"i":60,"s":0.376,"t":[]},{"i":49,"s":0.366,"t":[]},{"i":67,"s":0.355,"t":[]},{"i":57,"s":0.353,"t":[]},{"i":85,"s":0.315,"t":[]},{"i":58,"s":0.306,"t":[]},{"i":86,"s":0.29,"t":[]},{"i":84,"s":0.285,"t":[]}],"coauthors":[]},{"id":"pietro-paparella","name":"Pietro Paparella","title":"Professor","department":"Engineering & Mathematics","program":"Mathematics","keywords":"nonnegative matrix theory; geometry of polynomials; discrete geometry","interests":"","bio":"Dr. Pietro Paparella is a professor of mathematics specializing in combinatorial matrix theory, the geometry of polynomials, matrix analysis, and nonnegative matrix theo  Mathematics at the University of Arizona. During her early years at UW Bothell, she developed the mathematics program, building it from the ground up and shaping its curriculum and direction. She also played a key role on the committee that established the School of STEM. Simonsen earned her Ph.D. in Mathematics Education from Oregon State University in 1995. She subsequently spent more than a decade in the Department of Mathematical Sciences at Montana State University in Bozeman, Montana.","listed":["Mathematics Education"],"url":"https://www.uwb.edu/faculty/linda-simonsen/","links":[],"orcid":"","openalex":["A5085823833"],"n_works":2,"works":[{"t":"The Impact of Participation in STEM Outreach on Persistence of Diverse Students in Physics, Math, and Engineering","y":2024,"v":"Journal of STEM Education Innovations and Research","u":"https://doi.org/10.63504/jstem.v25i2.2592"},{"t":"Elementary Teachers' Mathematical Knowledge for Teaching Prerequisite Algebra Concepts.","y":2011,"v":"IUMPST The Journal","u":"https://openalex.org/W141625467"}],"titles":["The Impact of Participation in STEM Outreach on Persistence of Diverse Students in Physics, Math, and Engineering","Elementary Teachers' Mathematical Knowledge for Teaching Prerequisite Algebra Concepts."],"oa_topics":["Career Development and Diversity","Mathematics Education and Teaching Techniques"],"x":0.1499,"y":0.7202,"area":0,"topic":0,"terms":["foundation","mathematics","support","scholarly","journal","distance","teach","secured external"],"sparse":false,"near":[{"i":61,"s":0.592,"t":["mathematics"]},{"i":50,"s":0.532,"t":[]},{"i":12,"s":0.513,"t":[]},{"i":54,"s":0.509,"t":[]},{"i":55,"s":0.483,"t":[]},{"i":85,"s":0.37,"t":[]},{"i":49,"s":0.347,"t":["mathematics"]},{"i":52,"s":0.346,"t":[]},{"i":83,"s":0.346,"t":[]},{"i":59,"s":0.271,"t":[]}],"coauthors":[[86,1]]},{"id":"shima-abadi","name":"Shima Abadi","title":"Professor","department":"Engineering & Mathematics","program":"Mechanical Engineering","keywords" sts":"","bio":"Dr. Miguel Balzan is a mechanical engineer and academic specializing in thermal–fluid sciences, with a sustained record of research innovation and undergraduate engineering education across multiple international institutions. His scholarly work encompasses experimental and computational investigations in multiphase flows, droplet impact dynamics, rheology, and related transport phenomena, leading to peer‑reviewed publications, conference presentations, industry‑sponsored reports, and a granted U.S. patent. Complementing this research portfolio, he has developed and delivered rigorous, project‑based curricula in thermodynamics, fluid mechanics, heat transfer, and related areas, emphasizing conceptual understanding, analytical proficiency, and engagement with authentic engineering problems. Balzan's teaching is further strengthened by the mentorship of undergraduate and graduate researchers, the development of laboratory infrastructure, and the integration of industry collaboration into the learning environment. Collectively, these experiences reflect a professional commitment to advancing the thermal–fluid sciences while fostering high‑quality, practice‑informed engineering education.","listed":["Fluid Mechanics"],"url":"https://www.uwb.edu/faculty/miguel-balzan/","links":[],"orcid":"","openalex":["A5080169456"],"n_works":12,"works":[{"t":"A Direct-Measurement Method for Characterizing Wall Shear in Harsh Fluids","y":2025,"v":"SPE Annual Technical Conference and Exhibition","u":"https://doi.org/10.2118/228114-ms"},{"t":"Sensor Development for Direct Wall Shear Measurements in Taylor-Couette Flows","y":2024,"v":"AIAA AVIATION Forum","u":"https://doi.org/10.2514/6.2024-4380"},{"t":"Influence of rheology and micropatterns on spreading, retraction and fingering of an impacting drop","y":2023,"v":"Soft Matter","u":"https://doi.org/10.1039/d3sm00944k"},{"t":"Drop impact of non-Newtonian dairy-based solutions","y":2021,"v":"Colloids and Surfaces A Physicoche <script>(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const P = DATA.people;
  const META = DATA.meta;

  // ------------------------------------------------------------ helpers
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const SLOTS = 8;

  function rankOf(title) {
    const t = title.toLowerCase();
    if (t.includes("teaching") || t.includes("lecturer")) return "Teaching track";
    if (t.includes("assistant professor")) return "Assistant Professor";
    if (t.includes("associate professor")) return "Associate Professor";
    if (t.includes("professor")) return "Professor";
    return "Other";
  }
  P.forEach((p, i) => { p.i = i; p.rank = rankOf(p.title); });
  // People with no text at all are not drawn but can still be found by search.
  const M = P.filter((p) => !p.off);

  // Stable group order per colour mode, computed once from all people, so a
  // filter never repaints the survivors. Largest group gets slot 1.
  function groupsFor(mode) {
    const key = mode === "area" ? (p) => String(p.area) : (p) => p[mode];
    const counts = d3.rollup(M, (v) => v.length, key);
    const order = [...counts.keys()].sort((a, b) => counts.get(b) - counts.get(a) || String(a).localeCompare(String(b)));
    const label = (k) => {
      if (mode !== "area") return k;
      const a = DATA.areas.find((x) => String(x.id) === k);
      return a && a.label ? a.label : "Area " + (Number(k) + 1);
    };
    return { key, order, counts, label, slot: new Map(order.map((k, i) => [k, i < SLOTS ? i + 1 : 0])) };
  }
  const GROUPS = { department: groupsFor("department"), program: groupsFor("program"), area: groupsFor("area") };

  const DEPTS = [...new Set(P.map((p) => p.department))].sort();
  const SHAPES = ["circle", "square", "triangle", "diamond", "circle", "square"];
  const shapeOf = (p) => SHAPES[DEPTS.indexOf(p.department) % SHAPES.length];

  // ------------------------------------------------------------ state
  const state = {
    colorBy: ["department", "program", "area"].includes(META.color_by) ? META.color_by : "department",
    dept: "",
    rank: "",
    q: "",
    focus: null, // legend group key being highlighted
    sel: null, // selected person index
    hover: null,
  };

  let palette = {};
  function readPalette() {
    palette = { other: css("--other"), ink: css("--ink"), ink2: css("--ink-2"), muted: css("--muted"), surface: css("--surface"), grid: css("--grid"), hi: css("--hi") };
    for (let s = 1; s <= SLOTS; s++) palette[s] = css("--s" + s);
  }
  const colorOf = (p) => {
    const g = GROUPS[state.colorBy];
    const s = g.slot.get(g.key(p));
    return s ? palette[s] : palette.other;
  };

  // ------------------------------------------------------------ search
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  P.forEach((p) => {
    p._name = norm(p.name);
    p._kw = norm([p.keywords, p.interests, p.listed.join(" "), p.terms.join(" "), p.oa_topics.join(" . ")].join(" . "));
    p._ttl = p.titles.map(norm);
    p._bio = norm(p.bio);
  });
  function search(q) {
    const words = norm(q).split(/[\s,]+/).filter((w) => w.length > 1);
    if (!words.length) return null;
    const phrase = norm(q).trim();
    const hits = [];
    for (const p of P) {
      let score = 0;
      if (p._name.includes(phrase)) score += 10;
      if (phrase.includes(" ") && p._kw.includes(phrase)) score += 6;
      let all = true;
      for (const w of words) {
        const inName = p._name.includes(w), inKw = p._kw.includes(w), inBio = p._bio.includes(w);
        const nTitles = p._ttl.reduce((n, t) => n + t.includes(w), 0);
        if (!(inName || inKw || inBio || nTitles)) all = false;
        // Titles: a few matching papers count, many do not keep adding (GTU: volume alone should not win).
        score += (inName ? 3 : 0) + (inKw ? 2 : 0) + (inBio ? 1 : 0) + Math.min(nTitles, 4) * 0.5;
      }
      if (phrase.includes(" ")) score += Math.min(p._ttl.filter((t) => t.includes(phrase)).length, 4);
      if (all && score > 0) hits.push({ p, score });
    }
    hits.sort((a, b) => b.score - a.score || a.p.name.localeCompare(b.p.name));
    return { words, hits };
  }
  let result = null;

  const passesFilters = (p) => (!state.dept || p.department === state.dept) && (!state.rank || p.rank === state.rank);
  function isActive(p) {
    if (!passesFilters(p)) return false;
    if (state.focus !== null && GROUPS[state.colorBy].key(p) !== state.focus) return false;
    if (result && !result.set.has(p.i)) return false;
    return true;
  }

  // ------------------------------------------------------------ canvas & zoom
  const canvas = $("map");
  const ctx = canvas.getContext("2d");
  const wrap = canvas.parentElement;
  let W = 0, H = 0, DPR = 1, base = { s: 1, ox: 0, oy: 0 };
  let T = d3.zoomIdentity;
  const PAD = 48;

  function resize() {
    const r = wrap.getBoundingClientRect();
    W = Math.max(200, r.width); H = Math.max(200, r.height);
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    const xs = d3.extent(M, (p) => p.x), ys = d3.extent(M, (p) => p.y);
    // Keep the open legend (top-left) clear of points when there is room beside it.
    const lb = $("legendbox");
    const left = lb.open && W > 700 ? lb.offsetWidth + 24 : PAD;
    const s = Math.min((W - left - PAD) / (xs[1] - xs[0] || 1), (H - 2 * PAD) / (ys[1] - ys[0] || 1));
    base = { s, ox: left + (W - left - PAD - s * (xs[1] - xs[0])) / 2 - s * xs[0], oy: (H - s * (ys[1] - ys[0])) / 2 - s * ys[0] };
    zoom.extent([[0, 0], [W, H]]).translateExtent([[-W, -H], [2 * W, 2 * H]]);
    draw();
  }
  const sx = (x) => T.applyX(base.ox + base.s * x);
  const sy = (y) => T.applyY(base.oy + base.s * y);

  const zoom = d3.zoom().scaleExtent([0.6, 14]).on("zoom", (e) => { T = e.transform; hideTip(); draw(); });
  d3.select(canvas).call(zoom).on("dblclick.zoom", null);
  $("zin").onclick = () => d3.select(canvas).transition().duration(250).call(zoom.scaleBy, 1.6);
  $("zout").onclick = () => d3.select(canvas).transition().duration(250).call(zoom.scaleBy, 1 / 1.6);
  $("zreset").onclick = () => d3.select(canvas).transition().duration(350).call(zoom.transform, d3.zoomIdentity);

  function zoomTo(points, maxK = 4) {
    if (!points.length) return;
    const xs = d3.extent(points, (p) => base.ox + base.s * p.x), ys = d3.extent(points, (p) => base.oy + base.s * p.y);
    const w = Math.max(xs[1] - xs[0], 40), h = Math.max(ys[1] - ys[0], 40);
    const panelSafe = W > 500 ? 0.7 : 0.8;
    const k = Math.min(maxK, panelSafe * Math.min(W / w, H / h));
    const cx = (xs[0] + xs[1]) / 2, cy = (ys[0] + ys[1]) / 2;
    d3.select(canvas).transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * cx, H / 2 - k * cy).scale(k));
  }

  // ------------------------------------------------------------ drawing
  const R = 5.5;
  function marker(x, y, r, shape) {
    ctx.beginPath();
    if (shape === "square") { const a = r * 0.9; ctx.rect(x - a, y - a, 2 * a, 2 * a); }
    else if (shape === "triangle") { const a = r * 1.25; ctx.moveTo(x, y - a); ctx.lineTo(x + a * 0.95, y + a * 0.7); ctx.lineTo(x - a * 0.95, y + a * 0.7); ctx.closePath(); }
    else if (shape === "diamond") { const a = r * 1.2; ctx.moveTo(x, y - a); ctx.lineTo(x + a, y); ctx.lineTo(x, y + a); ctx.lineTo(x - a, y); ctx.closePath(); }
    else ctx.arc(x, y, r, 0, Math.PI * 2);
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const k = T.k;
    const r = R * Math.min(1.6, Math.max(1, Math.sqrt(k) * 0.85));
    const sel = state.sel !== null && !P[state.sel].off ? P[state.sel] : null;

    // Links from the selected person to their nearest people.
    if (sel) {
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = palette.muted;
      ctx.globalAlpha = 0.55;
      for (const n of sel.near.slice(0, 10)) {
        const q = P[n.i];
        ctx.beginPath(); ctx.moveTo(sx(sel.x), sy(sel.y)); ctx.lineTo(sx(q.x), sy(q.y)); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    const nearSet = new Set(sel ? sel.near.map((n) => n.i) : []);
    const order = [...M].sort((a, b) => (isActive(a) - isActive(b)) || (nearSet.has(a.i) - nearSet.has(b.i)));
    for (const p of order) {
      const x = sx(p.x), y = sy(p.y);
      if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
      const active = isActive(p);
      ctx.globalAlpha = active ? 1 : 0.16;
      const col = colorOf(p);
      marker(x, y, r, shapeOf(p));
      if (p.sparse) {
        ctx.fillStyle = palette.surface; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = col; ctx.stroke();
      } else {
        ctx.fillStyle = col; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = palette.surface; ctx.stroke(); // 2px-ish surface ring on overlaps
      }
    }
    ctx.globalAlpha = 1;

    for (const idx of [state.hover, state.sel]) {
      if (idx === null || P[idx].off) continue;
      const p = P[idx];
      marker(sx(p.x), sy(p.y), r + 4, "circle");
      ctx.lineWidth = 2; ctx.strokeStyle = palette.hi; ctx.stroke();
    }

    drawLabels(k, r);
  }

  function drawLabels(k, r) {
    const boxes = [];
    const fits = (b) => !boxes.some((o) => b.x < o.x + o.w && b.x + b.w > o.x && b.y < o.y + o.h && b.y + b.h > o.y);
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    const label = (text, x, y, font, color, align = "center") => {
      ctx.font = font;
      const w = ctx.measureText(text).width;
      const bx = align === "center" ? x - w / 2 : x;
      const b = { x: bx - 3, y: y - 9, w: w + 6, h: 18 };
      if (b.x < 0 || b.x + b.w > W || b.y < 0 || b.y + b.h > H || !fits(b)) return false;
      boxes.push(b);
      ctx.textAlign = align;
      ctx.lineWidth = 4; ctx.strokeStyle = palette.surface; ctx.strokeText(text, x, y);
      ctx.fillStyle = color; ctx.fillText(text, x, y);
      return true;
    };

    // Selected and hovered names always win the space.
    for (const idx of [state.sel, state.hover]) {
      if (idx === null || P[idx].off) continue;
      const p = P[idx];
      label(p.name, sx(p.x) + r + 7, sy(p.y), "600 13px system-ui, sans-serif", palette.ink, "left");
    }

    if (k < 1.7) {
      for (const a of DATA.areas) if (a.label) label(a.label, sx(a.x), sy(a.y), "650 13px system-ui, sans-serif", palette.ink);
    } else if (k < 3.2) {
      for (const a of DATA.topics) if (a.label && a.n > 1) label(a.label, sx(a.x), sy(a.y), "600 12px system-ui, sans-serif", palette.ink2);
    }
    if (k >= 2.4) {
      const visible = M.filter((p) => isActive(p) && sx(p.x) > 0 && sx(p.x) < W && sy(p.y) > 0 && sy(p.y) < H);
      if (k >= 3.2 || visible.length < 40) {
        for (const p of visible) label(p.name, sx(p.x) + r + 5, sy(p.y), "12px system-ui, sans-serif", palette.ink2, "left");
      }
    }
  }

  // ------------------------------------------------------------ hit testing & tooltip
  function hit(mx, my) {
    let best = null, bd = 14 * 14;
    for (const p of M) {
      const dx = sx(p.x) - mx, dy = sy(p.y) - my, d = dx * dx + dy * dy;
      if (d < bd && (isActive(p) || d < 36)) { bd = d; best = p; }
    }
    return best;
  }
  const tip = $("tip");
  function showTip(p, mx, my) {
    tip.innerHTML = `<b>${esc(p.name)}</b><span class="k">${esc(p.title)} · ${esc(p.program)}</span><div>${esc((p.keywords || p.interests || p.terms.join(", ")).slice(0, 160))}</div>`;
    tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = mx + 14, y = my + 14;
    if (x + tw > W - 8) x = mx - tw - 14;
    if (y + th > H - 8) y = my - th - 14;
    tip.style.left = Math.max(4, x) + "px"; tip.style.top = Math.max(4, y) + "px";
  }
  function hideTip() { tip.hidden = true; }

  canvas.addEventListener("pointermove", (e) => {
    if (e.buttons) return;
    const r = canvas.getBoundingClientRect();
    const p = hit(e.clientX - r.left, e.clientY - r.top);
    const idx = p ? p.i : null;
    canvas.classList.toggle("pointing", !!p);
    if (idx !== state.hover) { state.hover = idx; draw(); }
    if (p) showTip(p, e.clientX - r.left, e.clientY - r.top); else hideTip();
  });
  canvas.addEventListener("pointerleave", () => { state.hover = null; hideTip(); draw(); });
  canvas.addEventListener("click", (e) => {
    const r = canvas.getBoundingClientRect();
    const p = hit(e.clientX - r.left, e.clientY - r.top);
    select(p ? p.i : null);
  });

  // ------------------------------------------------------------ panel
  const panel = $("panel");
  function chips(list) { return list.length ? `<ul class="chips">${list.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : ""; }
  function hl(text, words) {
    let out = esc(text);
    for (const w of words || []) {
      if (w.length < 2) continue;
      out = out.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>");
    }
    return out;
  }

  function renderOverview() {
    const n = M.length;
    const areas = DATA.areas.filter((a) => a.label).map((a) =>
      `<li><button type="button" data-area="${a.id}"><span class="who">${esc(a.label)}</span><span class="score">${a.n}</span></button></li>`).join("");
    panel.innerHTML = `
      <h2>${esc(META.name)}</h2>
      <p class="sub muted">${n} faculty · as of ${esc(META.as_of)}</p>
      <p>Each point is a faculty member. People who describe similar research sit close together. Click a point to see that person's research and the ten people closest to them.</p>
      <p class="muted">Shapes mark departments. Hollow points have few publications and little profile text to go on, so their position is less certain.</p>
      <h3>Research areas (computed)</h3>
      <ul class="near">${areas}</ul>
      ${META.left_off.length ? `<p class="muted">Not on the map, because there is no research or teaching text or matched publication for them (they can still be found by search): ${META.left_off.map(esc).join(", ")}.</p>` : ""}
      <h3>How this map is made</h3>
      <p class="bio">${esc(META.method)}</p>
      <p class="bio">Sources: ${META.sources.map((u) => `<a href="${esc(u)}">${esc(u.replace(/^https?:\/\//, ""))}</a>`).join(", ")}. Corrections go to the directory page; the map is rebuilt from it.</p>`;
    panel.querySelectorAll("[data-area]").forEach((b) => b.onclick = () => {
      const id = Number(b.dataset.area);
      setColorBy("area");
      state.focus = String(id);
      renderLegend(); draw();
      zoomTo(M.filter((p) => p.area === id), 3);
    });
  }

  function renderPerson(p) {
    const links = [`<a href="${esc(p.url)}" target="_blank" rel="noopener">Directory profile</a>`]
      .concat(p.links.map((l) => `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.text)}</a>`))
      .concat(p.orcid ? [`<a href="https://orcid.org/${esc(p.orcid)}" target="_blank" rel="noopener">ORCID</a>`] : [])
      .concat(p.openalex.map((a, k) => `<a href="https://openalex.org/${esc(a)}" target="_blank" rel="noopener">OpenAlex${p.openalex.length > 1 ? " " + (k + 1) : ""}</a>`));
    const works = p.works.map((w) =>
      `<li><a href="${esc(w.u)}" target="_blank" rel="noopener">${hl(w.t, result ? result.words : [])}</a><span class="why">${esc(w.y || "")}${w.v ? " · " + esc(w.v) : ""}</span></li>`).join("");
    const co = (p.coauthors || []).map(([j, n]) =>
      `<li><button type="button" data-i="${j}"><span class="who">${esc(P[j].name)}</span><span class="score">${n} paper${n === 1 ? "" : "s"}</span></button></li>`).join("");
    const near = p.near.map((n) => {
      const q = P[n.i];
      const why = n.t.length ? "shared: " + n.t.join(", ") : esc(q.keywords || q.interests).slice(0, 90);
      return `<li><button type="button" data-i="${q.i}"><span class="who">${esc(q.name)}</span><span class="score">${q.department === p.department ? "" : esc(q.department)}</span><span class="why">${esc(q.program)} · ${esc(why)}</span></button></li>`;
    }).join("");
    const words = result ? result.words : [];
    panel.innerHTML = `
      <div class="card">
        <button type="button" class="ghost back" id="back">← ${result ? "Back to results" : "Overview"}</button>
        <h2>${esc(p.name)}</h2>
        <p class="sub">${esc(p.title)} · ${esc(p.program)}${p.program !== p.department ? " (" + esc(p.department) + ")" : ""}</p>
        ${p.keywords ? `<h3>Research (directory)</h3><p>${hl(p.keywords, words)}</p>` : ""}
        ${p.interests && p.interests !== p.keywords ? `<h3>Research interests (profile)</h3><p>${hl(p.interests, words)}</p>` : ""}
        ${p.listed.length ? `<h3>Listed research areas</h3>${chips(p.listed)}` : ""}
        ${p.off ? `<p class="muted">Not on the map: the directory and profile pages have no research or teaching text for this person, and no publications were matched.</p>` : ""}
        ${p.terms.length ? `<h3>Distinctive terms</h3>${chips(p.terms)}` : ""}
        ${p.oa_topics.length ? `<h3>Publication topics (OpenAlex)</h3>${chips(p.oa_topics)}` : ""}
        ${p.off ? "" : `<h3>Closest people</h3>${near ? `<ul class="near">${near}</ul>` : `<p class="muted">No one is close enough to show: this person's research is unlike the rest of the school's.</p>`}`}
        ${co ? `<h3>Co-authors on this map</h3><ul class="near">${co}</ul>` : ""}
        ${p.works.length ? `<h3>Recent publications <span class="count">(${p.n_works} since 2011)</span></h3><ul class="pubs">${works}</ul>` : ""}
        ${p.bio ? `<h3>Bio</h3><p class="bio">${hl(p.bio, words)}</p>` : ""}
        <h3>Links</h3><div class="links">${links.join("")}</div>
        ${p.sparse && !p.off ? `<p class="muted" style="margin-top:12px">Few publications and little profile text are available for this person, so the position is approximate.</p>` : ""}
      </div>`;
    $("back").onclick = () => select(null);
    panel.querySelectorAll("[data-i]").forEach((b) => b.onclick = () => select(Number(b.dataset.i), true));
    panel.scrollTop = 0;
  }

  function renderHits() {
    const shown = result.hits.filter((h) => passesFilters(h.p));
    panel.innerHTML = `<h2>${shown.length} match${shown.length === 1 ? "" : "es"}</h2>
      <p class="sub muted">for “${esc(state.q)}”${state.dept || state.rank ? " within the filters" : ""}</p>
      <ul class="hits">${shown.map(({ p }) => {
        const hitTitle = p.titles.find((t) => result.words.every((w) => norm(t).includes(w))) || p.titles.find((t) => result.words.some((w) => norm(t).includes(w)));
        const why = [p.keywords, p.interests].find((t) => result.words.some((w) => norm(t).includes(w))) || hitTitle || p.keywords || p.interests || "";
        return `<li><button type="button" data-i="${p.i}"><b>${hl(p.name, result.words)}</b> <span class="muted">${esc(p.program)}</span><span class="why">${hl(why.slice(0, 160), result.words)}</span></button></li>`;
      }).join("")}</ul>
      ${shown.length ? "" : `<p class="muted">No one matches. Try a broader word, or clear the filters.</p>`}`;
    panel.querySelectorAll("[data-i]").forEach((b) => b.onclick = () => select(Number(b.dataset.i), true));
  }

  function renderPanel() {
    if (state.sel !== null) renderPerson(P[state.sel]);
    else if (result) renderHits();
    else renderOverview();
  }

  function select(i, pan = false) {
    state.sel = i;
    try { history.replaceState(null, "", i === null ? location.pathname + location.search : "#p=" + encodeURIComponent(P[i].id)); } catch (_) { /* file:// in some browsers */ }
    renderPanel(); draw();
    if (i !== null && pan && !P[i].off) {
      const p = P[i];
      zoomTo([p, ...p.near.slice(0, 5).map((n) => P[n.i])], 4);
    }
  }

  // ------------------------------------------------------------ legend
  const legend = $("legend");
  function swatch(color, shape, hollow = false) {
    const s = 14, c = s / 2;
    const fill = hollow ? "none" : color, stroke = color;
    let el;
    if (shape === "square") el = `<rect x="2.5" y="2.5" width="9" height="9"/>`;
    else if (shape === "triangle") el = `<polygon points="${c},1.5 12.5,11.5 1.5,11.5"/>`;
    else if (shape === "diamond") el = `<polygon points="${c},1 13,${c} ${c},13 1,${c}"/>`;
    else el = `<circle cx="${c}" cy="${c}" r="5"/>`;
    return `<svg width="${s}" height="${s}" aria-hidden="true"><g fill="${fill}" stroke="${stroke}" stroke-width="${hollow ? 2 : 0}">${el}</g></svg>`;
  }
  function renderLegend() {
    const g = GROUPS[state.colorBy];
    const shown = g.order.filter((k) => g.slot.get(k));
    const rest = g.order.filter((k) => !g.slot.get(k));
    const rows = shown.map((k) => {
      const shape = state.colorBy === "department" ? shapeOf({ department: k }) : "circle";
      return `<button type="button" data-k="${esc(k)}" aria-pressed="${state.focus === k}">${swatch(palette[g.slot.get(k)], shape)}<span>${esc(g.label(k))}</span><span class="n">${g.counts.get(k)}</span></button>`;
    });
    if (rest.length) rows.push(`<div class="note">${swatch(palette.other, "circle")} Other: ${rest.length} smaller groups</div>`);
    const shapes = state.colorBy === "department" ? "" :
      `<div class="note">${DEPTS.map((d) => swatch(palette.ink2, shapeOf({ department: d })) + " " + esc(d)).join("<br>")}</div>`;
    legend.innerHTML = rows.join("") + shapes + `<div class="note">${swatch(palette.ink2, "circle", true)} few publications, little text</div>`;
    legend.querySelectorAll("[data-k]").forEach((b) => b.onclick = () => {
      state.focus = state.focus === b.dataset.k ? null : b.dataset.k;
      renderLegend(); draw();
    });
  }

  // ------------------------------------------------------------ controls
  function setColorBy(mode) {
    state.colorBy = mode; state.focus = null;
    $("colorby").value = mode;
    renderLegend(); draw();
  }
  $("colorby").value = state.colorBy;
  $("colorby").onchange = (e) => setColorBy(e.target.value);

  for (const d of DEPTS) $("dept").insertAdjacentHTML("beforeend", `<option>${esc(d)}</option>`);
  for (const r of ["Professor", "Associate Professor", "Assistant Professor", "Teaching track", "Other"]) {
    const n = P.filter((p) => p.rank === r).length;
    if (n) $("rank").insertAdjacentHTML("beforeend", `<option value="${r}">${r} (${n})</option>`);
  }
  $("dept").onchange = (e) => { state.dept = e.target.value; renderPanel(); draw(); };
  $("rank").onchange = (e) => { state.rank = e.target.value; renderPanel(); draw(); };

  let qTimer = null;
  $("q").addEventListener("input", (e) => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      state.q = e.target.value.trim();
      const r = search(state.q);
      result = r ? { ...r, set: new Set(r.hits.map((h) => h.p.i)) } : null;
      state.sel = null;
      renderPanel(); draw();
      if (result && result.hits.length) zoomTo(result.hits.map((h) => h.p).filter((p) => passesFilters(p) && !p.off), 3);
    }, 160);
  });
  $("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && result && result.hits.length) select(result.hits[0].p.i, true);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.activeElement !== $("q")) select(null);
  });

  function applyTheme(t) {
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    readPalette(); renderLegend(); themeLabel(); draw();
  }
  function themeLabel() {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    $("theme").textContent = dark ? "Light" : "Dark";
    $("theme").setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
  }
  $("theme").onclick = () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    try { localStorage.setItem("rm-theme", next); } catch (_) { /* storage blocked */ }
    applyTheme(next);
  };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readPalette(); renderLegend(); draw(); });

  // ------------------------------------------------------------ start
  $("title").textContent = META.name + " research map";
  $("subtitle").textContent = `${M.length} faculty · built ${META.as_of} from public directory pages and OpenAlex`;
  $("foot").innerHTML = `Data: public ${esc(META.university)} directory and profile pages, and publications from <a href="https://openalex.org">OpenAlex</a>, as of ${esc(META.as_of)}. Not a ranking or evaluation of anyone. Model: ${esc(META.model)}.`;

  let saved = null;
  try { saved = localStorage.getItem("rm-theme"); } catch (_) { /* storage blocked */ }
  if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
  readPalette();
  themeLabel();
  renderLegend();
  if (window.innerWidth < 820) $("legendbox").open = false;
  $("legendbox").addEventListener("toggle", resize);
  new ResizeObserver(resize).observe(wrap);
  resize();
  const m = location.hash.match(/p=([^&]+)/);
  const start = m ? P.find((p) => p.id === decodeURIComponent(m[1])) : null;
  if (start) select(start.i, true); else renderPanel();
  window.__rm = { state, P, select, search: (q) => { $("q").value = q; $("q").dispatchEvent(new Event("input")); } };
})();
</script>
</body>
</html>
