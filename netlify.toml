# Netlify serves the pre-built map pages in site/. There is no build step on
# Netlify: the Python pipeline (run on halflife) writes site/ and commits it.
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*/index.html"
  [headers.values]
    # Maps change only when rebuilt; let browsers revalidate.
    Cache-Control = "public, max-age=0, must-revalidate"
